<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#111214" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>The Verandas Pickleball Cup</title>
  <style>
/* ============================================================
   The Verandas Pickleball Cup — Liquid Glass
   Two houses. One cup. Endless glory.
   ============================================================ */
:root {
  /* dark — flat, championship-app style */
  --glass-bg: #1a1c1e;              /* card */
  --glass-bg-strong: #232628;
  --glass-border: #2c2f31;          /* hairline */
  --glass-highlight: transparent;
  --text: #f4f5f4;
  --text-dim: rgba(235,240,236,.64);
  --text-faint: rgba(235,240,236,.4);
  --accent: #3dbb6e;                /* championship green */
  --accent-2: #9a7ad6;
  --good: #3dbb6e;
  --gold: #ffcf33;
  --bad: #ff6b6b;
  --smashers: #b18cf0;              /* House of the Mighty Smash */
  --smashers-deep: #5b3aa6;
  --dinkers: #64b9f2;               /* Order of the Noble Dink */
  --dinkers-deep: #1e6ea8;
  --radius: 14px;
  --radius-sm: 11px;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --blur: none;
  --page-bg: #111214;
  --surface-0: rgba(255,255,255,.04);
  --surface-1: rgba(255,255,255,.05);
  --surface-2: rgba(255,255,255,.07);
  --line: rgba(255,255,255,.12);
  --line-2: rgba(255,255,255,.18);
  --hover: rgba(255,255,255,.12);
  --inset: rgba(255,255,255,.06);
  --nav-bg: #1a1c1e;
}

/* ---------- light theme ---------- */
html[data-theme="light"] {
  /* light — the Wimbledon-app look: soft gray canvas, white cards, one green */
  --page-bg: #f4f4f5;
  --glass-bg: #ffffff;
  --glass-bg-strong: #ffffff;
  --glass-border: #e4e4e7;
  --glass-highlight: transparent;
  --text: #1b1b1f;
  --text-dim: #5b5b62;
  --text-faint: #9a9aa1;
  --accent: #007a33;
  --accent-2: #4a2683;
  --good: #007a33;
  --gold: #96700a;
  --bad: #c8102e;
  --smashers: #6d3ab0;
  --smashers-deep: #4a2683;
  --dinkers: #0f6fae;
  --dinkers-deep: #0a5486;
  --surface-0: #f7f7f8;
  --surface-1: #f4f4f6;
  --surface-2: #eeeef0;
  --line: #e4e4e7;
  --line-2: #d4d4d9;
  --hover: #e9e9ec;
  --inset: #ececef;
  --nav-bg: #ffffff;
  --shadow: 0 1px 2px rgba(20,25,22,.06);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
    Arial, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  color: var(--text);
  background: var(--page-bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ---------- flat canvas ---------- */
.bg { position: fixed; inset: 0; z-index: -2; background: var(--page-bg); }
.blob { display: none; }

/* ---------- glass surface ---------- */
.glass {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* ---------- app chrome ---------- */
.app-header {
  margin: 18px auto 0; max-width: 640px;
  padding: 0 4px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: calc(100% - 28px);
  background: none !important; border: 0 !important; box-shadow: none !important;
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0;
  flex-direction: row-reverse; flex: 1; justify-content: space-between; }
.brand-mark {
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-size: 21px;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
}
.brand-text { min-width: 0; }
.brand-text h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.3px;
  line-height: 1.15; }
.brand-text p { margin: 2px 0 0; font-size: 11.5px; color: var(--text-dim); }

.app-main {
  max-width: 640px; margin: 14px auto 0;
  width: calc(100% - 28px);
  padding-bottom: calc(86px + env(safe-area-inset-bottom));
}
.tab-panel { display: none; }
.tab-panel.is-active { display: block; animation: fade .3s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- bottom tab bar ---------- */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 40;
  display: flex; justify-content: space-around; align-items: stretch;
  padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
  background: var(--nav-bg);
  border-top: 1px solid var(--glass-border);
}
.bnav {
  appearance: none; border: 0; background: transparent; cursor: pointer;
  flex: 1; max-width: 110px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 4px 4px; color: var(--text-faint);
  font-family: inherit; font-size: 10.5px; font-weight: 600; letter-spacing: .2px;
  transition: color .2s ease;
}
.bnav .ico { font-size: 21px; line-height: 1; filter: grayscale(1) opacity(.55); transition: filter .2s ease; }
.bnav.is-active { color: var(--accent); font-weight: 700; }
.bnav.is-active .ico { filter: none; }
.bnav:not(.is-active):hover { color: var(--text-dim); }

/* ---------- cards & generic ---------- */
.card { padding: 16px; margin-bottom: 14px; }
.card h2 { margin: 0 0 3px; font-size: 17px; }
.card .sub { margin: 0 0 12px; color: var(--text-dim); font-size: 12.5px; }
.section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--text-faint); margin: 0 0 8px; }

.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-dim);
  margin-bottom: 6px; letter-spacing: .3px; }

input[type="text"], input[type="number"], select {
  width: 100%; color: var(--text); font-size: 15px; font-family: inherit;
  padding: 11px 13px; border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  transition: border .2s, background .2s;
}
input::placeholder { color: var(--text-faint); }
input:focus, select:focus { outline: none; border-color: var(--accent);
  background: var(--hover); }
select option { color: #10142c; }

/* ---------- buttons ---------- */
.btn {
  appearance: none; cursor: pointer; font-family: inherit; font-weight: 600;
  font-size: 14.5px; color: var(--text); padding: 12px 18px; border-radius: 10px;
  background: var(--glass-bg); border: 1px solid var(--line-2);
  transition: transform .12s ease, background .2s ease;
}
.btn:hover { background: var(--hover); }
.btn:active { transform: scale(.97); }
.btn.primary {
  color: #fff; border-color: transparent;
  background: var(--accent);
}
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 8px 12px; font-size: 13px; border-radius: 11px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ---------- head-to-head hero ---------- */
.h2h { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;
  padding: 6px 0 2px; }
.h2h .house { text-align: center; min-width: 0; }
.h2h .house .crest { font-size: 30px; }
.h2h .house .hname { font-weight: 800; font-size: 14.5px; margin-top: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h2h .house .score { font-size: 42px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.h2h .house .cats { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
.h2h .house.sm .hname, .h2h .house.sm .score { color: var(--smashers); }
.h2h .house.dk .hname, .h2h .house.dk .score { color: var(--dinkers); }
.h2h .vs { font-size: 18px; color: var(--text-faint); font-weight: 800; padding: 0 2px; }

.progress { height: 10px; border-radius: 6px; overflow: hidden; display: flex;
  background: var(--inset); border: 1px solid var(--line); margin: 14px 0 6px; }
.progress .p-sm { background: linear-gradient(90deg, var(--smashers-deep), var(--smashers)); }
.progress .p-dk { background: linear-gradient(270deg, var(--dinkers-deep), var(--dinkers)); }
.progress-note { text-align: center; font-size: 12px; color: var(--text-dim); }

.lead-banner { text-align: center; padding: 8px 10px 2px; }
.lead-banner .cup { font-size: 26px; }
.lead-banner .who { font-size: 18px; font-weight: 800; margin-top: 2px; }
.lead-banner .who.sm { color: var(--smashers); }
.lead-banner .who.dk { color: var(--dinkers); }
.lead-banner .who.tie { color: var(--gold); }
.lead-banner .txt { color: var(--text-dim); font-size: 12.5px; margin-top: 3px; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; gap: 9px; }
.row-item {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 15px; border-radius: var(--radius-sm);
  background: var(--surface-1); border: 1px solid var(--line);
}
.row-item .main { min-width: 0; flex: 1; }
.row-item .ttl { font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; }
.row-item .meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
.row-item.clickable { cursor: pointer; transition: background .18s; }
.row-item.clickable:hover { background: var(--line); }
.row-item.won-sm { border-left: 3px solid var(--smashers); }
.row-item.won-dk { border-left: 3px solid var(--dinkers); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
  padding: 6px 10px; border-radius: 999px; background: var(--surface-2);
  border: 1px solid var(--line); white-space: nowrap; }
.pill.sm { color: var(--smashers); border-color: rgba(197,157,255,.45); }
.pill.dk { color: var(--dinkers); border-color: rgba(123,220,255,.45); }
.pill.gold { color: var(--gold); border-color: rgba(255,212,121,.4); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }

.inline-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.inline-form .field { margin: 0; flex: 1 1 130px; }
.grow { flex: 1 1 auto; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .two-col { grid-template-columns: 1fr; } }

/* ---------- contest detail ---------- */
.side-block { padding: 13px; border-radius: var(--radius-sm);
  background: var(--inset); border: 1px solid rgba(255,255,255,.1); }
.side-block .side-name { font-weight: 800; font-size: 13px; margin-bottom: 9px; }
.side-block.sm { border-color: rgba(197,157,255,.35); }
.side-block.sm .side-name { color: var(--smashers); }
.side-block.dk { border-color: rgba(123,220,255,.35); }
.side-block.dk .side-name { color: var(--dinkers); }
.side-block .field { margin-bottom: 8px; }
.side-block .field:last-child { margin-bottom: 0; }

.game-row { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
.game-row .glbl { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .6px; width: 52px; }
.game-row .dash { color: var(--text-faint); font-weight: 800; }
.game-row input { text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

.result-line { text-align: center; padding: 10px 0 2px; }
.result-line .players { font-size: 14px; font-weight: 700; }
.result-line .players .side-a { color: var(--smashers); }
.result-line .players .side-b { color: var(--dinkers); }
.result-line .scoreline { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 4px; }
.result-line .note { font-size: 12px; color: var(--text-dim); margin-top: 3px; }

/* ---------- houses tab ---------- */
.house-card { position: relative; overflow: hidden; }
.house-card.sm { border-color: rgba(197,157,255,.4); }
.house-card.dk { border-color: rgba(123,220,255,.4); }
.house-card .hc-top { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.house-card .hc-crest { font-size: 34px; }
.house-card .hc-name { font-size: 19px; font-weight: 800; margin: 0; }
.house-card.sm .hc-name { color: var(--smashers); }
.house-card.dk .hc-name { color: var(--dinkers); }
.house-card .hc-title { font-size: 12px; color: var(--text-dim); margin: 1px 0 0; }
.house-card .hc-motto { font-size: 12.5px; font-style: italic; color: var(--text-faint); margin: 8px 0 14px; }
.roster { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
.roster .player { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600;
  padding: 6px 8px; border-radius: 10px; background: var(--surface-0); }
.roster .num { width: 20px; height: 20px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-size: 10px; font-weight: 800;
  background: var(--surface-2); color: var(--text-dim); }

/* ---------- segmented control ---------- */
.seg { display: flex; gap: 4px; padding: 3px; border-radius: 10px;
  background: var(--inset); }
.seg button {
  appearance: none; border: 0; cursor: pointer; flex: 1;
  color: var(--text-dim); background: transparent;
  padding: 9px 8px; border-radius: 8px;
  font-family: inherit; font-size: 13px; font-weight: 600;
  transition: all .18s ease; white-space: nowrap;
}
.seg button.is-active {
  color: #fff;
  background: var(--accent);
}

/* ---------- point-by-point scorer ---------- */
.live-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin: 12px 0 4px; }
.tap-btn {
  appearance: none; cursor: pointer; font-family: inherit; color: var(--text);
  text-align: center; padding: 18px 10px 15px; border-radius: 18px;
  border: 1px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight);
  transition: transform .12s, filter .2s;
}
.tap-btn:active { transform: scale(.96); }
.tap-btn:disabled { opacity: .55; cursor: default; }
.tap-btn.sm { background: linear-gradient(150deg, rgba(197,157,255,.30), rgba(197,157,255,.10)); }
.tap-btn.dk { background: linear-gradient(150deg, rgba(123,220,255,.30), rgba(123,220,255,.10)); }
.tap-btn .lscore { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.05; }
.tap-btn.sm .lscore { color: var(--smashers); }
.tap-btn.dk .lscore { color: var(--dinkers); }
.tap-btn .lwho { font-size: 12.5px; font-weight: 700; margin-top: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tap-btn .ltap { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }
.tap-btn .l-serve { font-size: 10.5px; color: var(--good); font-weight: 800; letter-spacing: .5px; margin-top: 2px; }
.board-half .b-srv { font-size: 2.4vmin; color: #5ff0b0; font-weight: 800; letter-spacing: .3vmin; }
.badge.gp { color: #0b1026; font-weight: 800; border: 0;
  background: linear-gradient(150deg, #ffd479, #ffb35c);
  box-shadow: 0 4px 14px rgba(255,190,90,.4);
  animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.live-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.saved-games { font-size: 12.5px; color: var(--text-dim); margin-top: 8px; }

/* ---------- roster records ---------- */
.player.clickable { cursor: pointer; transition: background .18s; }
.player.clickable:hover { background: var(--line); }
.player .pname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec { display: inline-flex; gap: 5px; font-size: 10.5px; font-weight: 800; flex: none; }
.rec .rw { color: var(--good); }
.rec .rl { color: var(--bad); }
.rec.dim { color: var(--text-faint); font-weight: 600; }
.phist-title { font-size: 13px; font-weight: 800; margin: 0 0 10px; }
.phist-title .who { color: var(--gold); }

/* ---------- courtside scoreboard ---------- */
.board { position: fixed; inset: 0; z-index: 55; display: none; flex-direction: column;
  background: #06121f; color: #f2f8fc; }
.board.open { display: flex; }
@media (orientation: landscape) { .board.open { flex-direction: row; } }
.board-half { flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 1vmin; cursor: pointer; user-select: none;
  -webkit-user-select: none; border: 0; font-family: inherit; }
.board-half.sm { background: linear-gradient(160deg, rgba(122,79,208,.3), rgba(122,79,208,.05)); }
.board-half.dk { background: linear-gradient(340deg, rgba(47,127,208,.3), rgba(47,127,208,.05)); }
.board-half .b-score { font-size: 30vmin; font-weight: 800; line-height: .9;
  font-variant-numeric: tabular-nums; }
.board-half.sm .b-score { color: #c59dff; }
.board-half.dk .b-score { color: #7bdcff; }
.board-half .b-name { font-size: 3.4vmin; font-weight: 700;
  color: rgba(233,238,255,.75); max-width: 86%; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.board-half .b-hint { font-size: 2vmin; color: rgba(233,238,255,.4); }
.board-mid { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  z-index: 2; pointer-events: none; text-align: center; }
.board-ctl { position: absolute; top: calc(10px + env(safe-area-inset-top));
  left: 12px; right: 12px; display: flex; justify-content: space-between; z-index: 3; }
.board-ctl .btn { background: rgba(255,255,255,.12); color: #f4f7ff;
  border-color: rgba(255,255,255,.25); }

/* ---------- QR modal ---------- */
.modal-back { position: fixed; inset: 0; z-index: 65; display: none;
  align-items: center; justify-content: center; background: rgba(5,8,25,.6);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 20px; }
.modal-back.open { display: flex; }
.qr-card { background: #ffffff; color: #10142c; border-radius: 22px;
  padding: 22px 22px 18px; text-align: center; max-width: 340px; width: 100%;
  box-shadow: 0 24px 60px rgba(0,0,0,.5); }
.qr-card img { width: 100%; max-width: 264px; image-rendering: pixelated; display: block; margin: 0 auto; }
.qr-card .qr-title { font-weight: 800; font-size: 15px; margin: 10px 0 2px; }
.qr-card .qr-sub { font-size: 12px; color: rgba(16,20,44,.6); line-height: 1.45; }

/* ---------- cup stats ---------- */
.stat-row { display: flex; align-items: baseline; gap: 12px; padding: 9px 2px;
  border-bottom: 1px solid var(--surface-1); font-size: 13.5px; }
.stat-row:last-child { border-bottom: 0; }
.stat-row .s-label { color: var(--text-dim); flex: 1; }
.stat-row .s-value { font-weight: 700; text-align: right; }
.stat-row .s-sub { font-size: 11.5px; color: var(--text-faint); }
.hdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.hdot.sm { background: var(--smashers); }
.hdot.dk { background: var(--dinkers); }
.podium-row { display: flex; align-items: center; gap: 10px; padding: 9px 2px;
  border-bottom: 1px solid var(--surface-1); }
.podium-row:last-child { border-bottom: 0; }
.podium-row .medal { font-size: 20px; flex: none; }
.podium-row .p-name { font-weight: 700; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.podium-row .p-stat { font-size: 12px; color: var(--text-dim); white-space: nowrap; }

/* ---------- momentum legend ---------- */
.mom-legend { display: flex; gap: 16px; justify-content: center; margin-top: 6px;
  font-size: 11.5px; color: var(--text-dim); font-weight: 600; }

/* ---------- court layout (true 20x44 proportions, aerial-photo look) ---------- */
.court-wrap { margin-top: 14px; border-radius: 14px; padding: 14px;
  background: linear-gradient(180deg, #74b04a, #619b3d);
  display: flex; justify-content: center;
  box-shadow: inset 0 2px 12px rgba(0,0,0,.15); }
.court { aspect-ratio: 20 / 44; height: min(56vh, 540px); max-width: 100%;
  border: 2.5px solid rgba(255,255,255,.95); overflow: hidden; position: relative;
  display: flex; flex-direction: column; }
.c-half { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column;
  position: relative; color: #fff; background: #1673b1; }
.c-half.over { opacity: .8; }
.c-row { flex: 15 1 0; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
.c-box { min-height: 0; display: flex; align-items: center; justify-content: center;
  padding: 6px 4px; }
.c-box + .c-box { border-left: 2px solid rgba(255,255,255,.92); }
.c-kitchen { flex: 7 1 0; min-height: 0; display: grid; place-items: center;
  font-size: 8px; font-weight: 700; letter-spacing: 3px; color: rgba(255,255,255,.4);
  background: #146aa5;
  border-top: 2px solid rgba(255,255,255,.92); border-bottom: 2px solid rgba(255,255,255,.92); }
.c-half .c-kitchen { border-bottom: 0; }
.c-half:last-child .c-kitchen { border-top: 0; border-bottom: 2px solid rgba(255,255,255,.92); }
.c-net { height: 9px; flex: none; position: relative; z-index: 1;
  background: repeating-linear-gradient(90deg, #101416 0 4px, #33393d 4px 8px);
  box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.c-fig { position: relative; display: flex; flex-direction: column; align-items: center;
  gap: 3px; max-width: 96%; }
.c-fig svg { width: 26px; height: auto; fill: #fff;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
.c-fig.serving svg { fill: #ffd23f;
  filter: drop-shadow(0 0 7px rgba(255,210,63,.95)); }
.fig-name { font-size: 10.5px; font-weight: 700; color: #fff; max-width: 100%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 1px 3px rgba(0,0,0,.65); letter-spacing: .2px; }
.fig-ball { position: absolute; top: 14px; right: calc(50% - 22px);
  width: 8px; height: 8px; border-radius: 50%; background: #ffd23f;
  box-shadow: 0 0 6px rgba(255,210,63,.9); }
.c-score { position: absolute; top: 6px; right: 6px; font-size: 14px; font-weight: 800;
  font-variant-numeric: tabular-nums; color: #fff; padding: 2px 9px; border-radius: 8px; }
.c-score.sm { background: var(--smashers-deep); }
.c-score.dk { background: var(--dinkers-deep); }
.c-swap { position: absolute; top: 6px; left: 6px; z-index: 2; padding: 4px 9px; font-size: 11px;
  background: rgba(255,255,255,.88); color: #14344c; border: 0; box-shadow: none; }
.serve-note { text-align: center; font-size: 12px; font-weight: 700; color: var(--good);
  margin-top: 10px; }
.serve-note span { font-weight: 600; color: var(--text-dim); }

/* ---------- big point buttons ---------- */
.tap-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.tap-big {
  appearance: none; border: 0; cursor: pointer; font-family: inherit;
  min-height: 76px; border-radius: 13px; color: #fff; padding: 12px 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: transform .1s ease, filter .15s ease;
}
.tap-big:active { transform: scale(.96); filter: brightness(1.15); }
.tap-big:disabled { opacity: .45; cursor: default; }
.tap-big.sm { background: var(--smashers-deep); }
.tap-big.dk { background: var(--dinkers-deep); }
.tap-big .tb-plus { font-size: 21px; font-weight: 800; line-height: 1; }
.tap-big .tb-name { font-size: 13px; font-weight: 700; max-width: 100%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tap-big .tb-sub { font-size: 9.5px; opacity: .75; letter-spacing: .4px; text-transform: uppercase; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%) translateY(20px);
  bottom: calc(86px + env(safe-area-inset-bottom));
  z-index: 60; display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-radius: 16px; max-width: min(400px, calc(100% - 32px));
  background: var(--nav-bg);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow), inset 0 1px 0 var(--glass-highlight);
  font-size: 13.5px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: all .25s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast button { appearance: none; border: 0; cursor: pointer; font-family: inherit;
  font-size: 13px; font-weight: 800; color: var(--accent); background: none; padding: 4px 6px;
  pointer-events: auto; }

/* ---------- switch rows ---------- */
.switch-row { display: flex; align-items: center; gap: 12px; padding: 11px 2px;
  border-bottom: 1px solid var(--surface-1); cursor: pointer; }
.switch-row:last-child { border-bottom: 0; }
.switch-row .sw-text { flex: 1; min-width: 0; }
.switch-row .sw-title { font-size: 14px; font-weight: 700; }
.switch-row .sw-sub { font-size: 11.5px; color: var(--text-faint); margin-top: 1px; }
.switch { width: 44px; height: 26px; border-radius: 999px; flex: none; position: relative;
  background: var(--inset); border: 1px solid var(--line); transition: all .2s ease; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
  border-radius: 50%; background: var(--text-faint); transition: all .2s ease; }
.switch.on { background: linear-gradient(150deg, #9be8ff, #a99bff); border-color: transparent; }
.switch.on::after { left: 20px; background: #0b1026; }

/* ---------- rally timeline ---------- */
.rally-line { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0 2px; min-height: 8px; }
.rally-dot { width: 8px; height: 8px; border-radius: 50%; }
.rally-dot.sm { background: var(--smashers); }
.rally-dot.dk { background: var(--dinkers); }
.run-note { font-size: 11.5px; color: var(--text-faint); margin-top: 6px; }

/* ---------- momentum chart ---------- */
.momentum svg { width: 100%; height: 74px; display: block; }

/* ---------- snapshot banner ---------- */
.snapshot-note {
  max-width: 640px; width: calc(100% - 28px); margin: 12px auto -6px;
  padding: 10px 16px; border-radius: 10px; text-align: center;
  font-size: 12.5px; font-weight: 700; color: #fff;
  background: var(--accent);
}

/* ---------- confetti ---------- */
.confetti { position: fixed; top: -20px; z-index: 70; pointer-events: none;
  font-size: 18px; animation: confall linear forwards; }
@keyframes confall {
  to { transform: translateY(110vh) rotate(720deg); opacity: .6; }
}

/* ---------- contest extras ---------- */
.sched-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.sched-row .field { flex: 1 1 120px; margin-bottom: 8px; }
.contest-photo { width: 100%; border-radius: var(--radius-sm); margin-top: 12px;
  border: 1px solid var(--line); display: block; }
.note-line { font-size: 13px; color: var(--text-dim); font-style: italic;
  text-align: center; margin-top: 8px; }

/* ---------- roster edit ---------- */
.player .rmv { appearance: none; border: 0; background: none; cursor: pointer;
  color: var(--text-faint); font-size: 15px; line-height: 1; padding: 0 2px; flex: none; }
.player .rmv:hover { color: var(--bad); }

/* ---------- misc ---------- */
.empty { text-align: center; color: var(--text-dim); padding: 24px 14px; font-size: 14px; }
.empty .big { font-size: 32px; display: block; margin-bottom: 10px; opacity: .8; }
.divider { height: 1px; background: var(--line); margin: 16px 0; border: 0; }
.spacer { height: 8px; }
.hint { font-size: 12px; color: var(--text-faint); margin-top: 8px; line-height: 1.5; }
.back-link { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  color: var(--text-dim); font-size: 14px; margin-bottom: 12px; background: none; border: 0; font-family: inherit; padding: 4px 0; }
.back-link:hover { color: var(--text); }
.decree { font-size: 12px; color: var(--text-faint); text-align: center; line-height: 1.6; }

  ];

  /* ---------------- storage ---------------- */
  const KEY = "verandas_cup_v1";

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  const esc = (s) =>
    String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const buzz = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

  function seedContests() {
    return DEFAULT_CONTESTS.map((c) => ({
      id: uid() + Math.random().toString(36).slice(2, 5),
      name: c.name, kind: c.kind, icon: c.icon, desc: c.desc,
      points: c.points != null ? c.points : 10,
      playersA: [], playersB: [],   // fielded players per house
      games: [],                     // [{a,b}] game scores
      winner: null,                  // 0 = Smashers, 1 = Dinkers
      done: false,
    }));
  }
  const defaultStore = () => ({
    contests: seedContests(),
    rosters: [HOUSES[0].roster.slice(), HOUSES[1].roster.slice()],
    created: Date.now(),
  });

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (Array.isArray(s.contests)) {
          if (!Array.isArray(s.rosters)) s.rosters = [HOUSES[0].roster.slice(), HOUSES[1].roster.slice()];
          return s;
        }
      }
    } catch (e) {}
    const s = defaultStore();
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
    return s;
  }
  function save() {
    if (VIEW) return;   // never persist a shared snapshot
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }

  let store = load();
  const ui = { tab: "overview", contestId: null, edit: null, playerOpen: null };

  /* ---------------- theme (light / dark / system) ---------------- */
  const THEME_KEY = "verandas_theme";
  const sysDark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

  // the in-memory value is the source of truth so theme switching works even
  // where localStorage is unavailable (sandboxed previews, blocked site data)
  let themePrefMem = null;
  try { themePrefMem = localStorage.getItem(THEME_KEY); } catch (e) {}
  function themePref() { return themePrefMem || "system"; }
  function applyTheme() {
    const pref = themePref();
    const dark = pref === "system" ? (sysDark ? sysDark.matches : true) : pref === "dark";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", dark ? "#111214" : "#f4f4f5");
  }
  function setThemePref(pref) {
    themePrefMem = pref;
    try { localStorage.setItem(THEME_KEY, pref); } catch (e) {}
    applyTheme();
  }
  if (sysDark && sysDark.addEventListener) {
    sysDark.addEventListener("change", () => { if (themePref() === "system") applyTheme(); });
  }
  applyTheme();

  /* ---------------- preferences ---------------- */
  const PREFS_KEY = "verandas_prefs";
  const defaultPrefs = () => ({ wake: true, autosave: true, speech: false, sound: false });
  let prefs = defaultPrefs();
  try { prefs = Object.assign(defaultPrefs(), JSON.parse(localStorage.getItem(PREFS_KEY) || "{}")); } catch (e) {}
  function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {} }

  /* ---------------- read-only snapshot mode (#s=…) ---------------- */
  let VIEW = false;
  (function () {
    const m = location.hash.match(/^#s=(.+)$/);
    if (!m) return;
    try {
      const json = decodeURIComponent(escape(atob(decodeURIComponent(m[1]))));
      const snap = JSON.parse(json);
      if (snap && snap.v === 2 && Array.isArray(snap.d)) {
        // compact QR payload: results indexed against the default roll
        const contests = seedContests();
        snap.d.forEach((r) => {
          const c = contests[r[0]];
          if (!c) return;
          c.done = true;
          c.winner = r[1];
          c.games = (r[2] || []).map((g) => ({ a: g[0], b: g[1] }));
          c.playersA = (r[3] || []).map((i) => HOUSES[0].roster[i]).filter(Boolean);
          c.playersB = (r[4] || []).map((i) => HOUSES[1].roster[i]).filter(Boolean);
        });
        snap.contests = contests;
        snap.rosters = [HOUSES[0].roster.slice(), HOUSES[1].roster.slice()];
      }
      if (snap && Array.isArray(snap.contests)) {
        store = { contests: snap.contests, rosters: snap.rosters || store.rosters, created: snap.t || Date.now() };
        VIEW = true;
        const note = document.createElement("div");
        note.className = "snapshot-note";
        note.innerHTML = "👁️ Read-only snapshot · " +
          (snap.t ? new Date(snap.t).toLocaleString() : "shared scoreboard");
        const header = document.querySelector(".app-header");
        header.parentNode.insertBefore(note, header.nextSibling);
      }
    } catch (e) {}
  })();

  /* ---------------- toast ---------------- */
  const toastEl = document.createElement("div");
  toastEl.className = "toast";
  document.body.appendChild(toastEl);
  let toastTimer = null;
  function toast(msg, actionLabel, actionFn) {
    clearTimeout(toastTimer);
    toastEl.innerHTML = "<span>" + msg + "</span>" +
      (actionLabel ? '<button id="toastAction">' + actionLabel + "</button>" : "");
    if (actionLabel) {
      toastEl.querySelector("#toastAction").addEventListener("click", () => {
        hideToast();
        actionFn();
      });
    }
    toastEl.classList.add("show");
    toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast() { toastEl.classList.remove("show"); }

  /* ---------------- sound effects (WebAudio) ---------------- */
  let audioCtx = null;
  function beep(freq, dur, delay) {
    if (!prefs.sound) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const t = audioCtx.currentTime + (delay || 0);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine"; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.12, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t); osc.stop(t + dur);
    } catch (e) {}
  }
  const pointSound = (side) => beep(side === 0 ? 620 : 460, 0.09);
  const fanfare = () => { beep(523, 0.12); beep(659, 0.12, 0.12); beep(784, 0.2, 0.24); };

  /* ---------------- score announcements ---------------- */
  function announce(text) {
    if (!prefs.speech || !window.speechSynthesis) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.05;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* ---------------- screen wake lock ---------------- */
  let wakeLock = null;
  async function acquireWake() {
    if (!prefs.wake || !("wakeLock" in navigator)) return;
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  function releaseWake() {
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && ui.edit && ui.edit.mode === "points") acquireWake();
  });

  const findContest = (id) => store.contests.find((c) => c.id === id);

  const roster = (i) => store.rosters[i];

  // decided, non-special contests a player was fielded in (decree: max 2)
  function fieldedCount(name) {
    let n = 0;
    store.contests.forEach((c) => {
      if (!c.done || c.winner == null || c.kind === "special") return;
      if (c.playersA.indexOf(name) >= 0 || c.playersB.indexOf(name) >= 0) n++;
    });
    return n;
  }

  /* ---------------- cup math ---------------- */
  function gamesWon(c) {
    let a = 0, b = 0;
    c.games.forEach((g) => { if (g.a > g.b) a++; else if (g.b > g.a) b++; });
    return [a, b];
  }

  // one point per contest won — by decree
  function cupTotals() {
    const pts = [0, 0];
    let decided = 0;
    store.contests.forEach((c) => {
      if (!c.done || c.winner == null) return;
      decided++;
      pts[c.winner]++;
    });
    return { pts, decided, total: store.contests.length };
  }

  function playersLabel(c, side) {
    const arr = side === 0 ? c.playersA : c.playersB;
    const names = (arr || []).filter(Boolean);
    return names.length ? names.join(" & ") : HOUSES[side].name;
  }

  /* ============================================================
     OVERVIEW TAB
     ============================================================ */
  const overviewEl = document.getElementById("tab-overview");

  function shareUrl() {
    const contests = store.contests.map((c) => ({
      id: c.id, name: c.name, kind: c.kind, icon: c.icon, desc: c.desc,
      court: c.court || "", time: c.time || "", note: c.note || "",
      playersA: c.playersA, playersB: c.playersB,
      games: c.games, winner: c.winner, done: c.done,
    }));
    const payload = { v: 1, t: Date.now(), contests, rosters: store.rosters };
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    return location.href.split("#")[0] + "#s=" + encodeURIComponent(b64);
  }

  // small enough to live in a scannable QR: decided results only, by index
  function compactShareUrl() {
    const d = [];
    store.contests.forEach((c) => {
      if (!c.done || c.winner == null) return;
      const ci = DEFAULT_CONTESTS.findIndex((dc) => dc.name === c.name);
      if (ci < 0) return; // council-added contests travel via the full link only
      d.push([
        ci, c.winner,
        c.games.map((g) => [g.a, g.b]),
        c.playersA.map((p) => store.rosters[0].indexOf(p)).filter((i) => i >= 0),
        c.playersB.map((p) => store.rosters[1].indexOf(p)).filter((i) => i >= 0),
      ]);
    });
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify({ v: 2, t: Date.now(), d }))));
    return location.href.split("#")[0] + "#s=" + encodeURIComponent(b64);
  }

  function openQrModal() {
    const url = compactShareUrl();
    let img = "";
    try {
      const qr = qrcode(0, "M");
      qr.addData(url);
      qr.make();
      img = qr.createDataURL(8, 16);
    } catch (e) {
      toast("Too many results for a QR — use Share standings instead.");
      return;
    }
    let modal = document.getElementById("qrModal");
    if (!modal) {
      modal = document.createElement("div");
      modal.id = "qrModal";
      modal.className = "modal-back";

      });
    }
    modal.innerHTML =
      '<div class="qr-card"><img alt="QR code for the scoreboard" src="' + img + '" />' +

      '<div style="margin-top:12px;"><button class="btn small block" id="qrClose" style="color:#10142c;background:rgba(16,20,44,.08);border-color:rgba(16,20,44,.15);box-shadow:none;">Close</button></div>' +
      "</div>";
    modal.classList.add("open");
  }

  function momentumHtml() {
    const seq = store.contests.filter((c) => c.done && c.winner != null);
    if (seq.length < 2) return "";
    let a = 0, b = 0;
    const pa = [[0, 0]], pb = [[0, 0]];
    seq.forEach((c, i) => {
      if (c.winner === 0) a++; else b++;
      pa.push([i + 1, a]); pb.push([i + 1, b]);
    });
    const max = Math.max(a, b, 1), n = seq.length;
    const px = (x) => (x / n) * 100;
    const py = (y) => 36 - (y / max) * 30;
    const pts = (arr) => arr.map((p) => px(p[0]).toFixed(1) + "," + py(p[1]).toFixed(1)).join(" ");
    const line = (arr, col) =>
      '<polyline points="' + pts(arr) + '" fill="none" stroke="var(--' + col + ')" stroke-width="2.5" ' +
      'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
    return '<div class="momentum"><svg viewBox="0 0 100 40" preserveAspectRatio="none">' +
      line(pa, "smashers") + line(pb, "dinkers") + "</svg></div>" +
      '<div class="mom-legend"><span><span class="hdot sm"></span>' + esc(HOUSES[0].name) + "</span>" +
      '<span><span class="hdot dk"></span>' + esc(HOUSES[1].name) + "</span></div>" +
      '<div class="progress-note">Momentum — points as each contest was decided</div>';
  }

  function scoreboardCanvas() {
    const t = cupTotals();
    const cv = document.createElement("canvas");
    cv.width = 1000; cv.height = 1250;
    const x = cv.getContext("2d");

    g.addColorStop(0, "#0b2740"); g.addColorStop(1, "#0e3520");
    x.fillStyle = g; x.fillRect(0, 0, 1000, 1250);
    x.textAlign = "center";
    x.fillStyle = "#f4f7ff"; x.font = "bold 46px Arial";

    x.fillText("Two houses · One cup · Endless glory", 500, 152);

    x.fillStyle = "#c59dff"; x.fillText("SONI SMASHERS", 260, 270);
    x.fillStyle = "#7bdcff"; x.fillText("SAM DINKERS", 740, 270);
    x.font = "bold 150px Arial";
    x.fillStyle = "#c59dff"; x.fillText(t.pts[0], 260, 440);
    x.fillStyle = "#7bdcff"; x.fillText(t.pts[1], 740, 440);
    x.fillStyle = "rgba(233,238,255,.5)"; x.font = "bold 34px Arial"; x.fillText("VS", 500, 380);
    x.font = "26px Arial";
    x.fillText(t.decided + " of " + t.total + " contests decided", 500, 512);
    x.textAlign = "left"; x.font = "28px Arial";
    let y = 590;
    store.contests.filter((c) => c.done && c.winner != null).slice(0, 13).forEach((c) => {
      x.fillStyle = c.winner === 0 ? "#c59dff" : "#7bdcff";
      const score = c.games.length ? "  (" + c.games.map((gm) => gm.a + "-" + gm.b).join(", ") + ")" : "";
      x.fillText((c.icon || "•") + "  " + c.name + " — " + HOUSES[c.winner].name.split(" ")[1] + score, 80, y);
      y += 46;
    });
    x.textAlign = "center"; x.fillStyle = "rgba(233,238,255,.45)"; x.font = "24px Arial";
    x.fillText(new Date().toLocaleDateString(), 500, 1205);
    return cv;
  }

  function cupStatsHtml() {
    const decided = store.contests.filter((c) => c.done && c.winner != null);
    const games = [];
    decided.forEach((c) => c.games.forEach((g) => games.push({ c, g })));
    if (!games.length) return "";

    let closest = null, biggest = null, golden = 0;
    const rallyPts = [0, 0];
    games.forEach((x) => {
      const m = Math.abs(x.g.a - x.g.b);
      rallyPts[0] += x.g.a; rallyPts[1] += x.g.b;
      if (m === 1) golden++;
      if (!closest || m < Math.abs(closest.g.a - closest.g.b)) closest = x;
      if (!biggest || m > Math.abs(biggest.g.a - biggest.g.b)) biggest = x;
    });
    const gameLine = (x) => x.g.a + "–" + x.g.b + ' <span class="s-sub">' + esc(x.c.name) + "</span>";

    // MVP: contest wins, then point difference across their games, then points won
    const seen = {};
    decided.forEach((c) => {
      if (c.kind === "special") return;
      [0, 1].forEach((side) => {
        (side === 0 ? c.playersA : c.playersB).forEach((p) => {
          const s = seen[p] || (seen[p] = { name: p, side, wins: 0, diff: 0, pts: 0 });
          s.side = side;
          if (c.winner === side) s.wins++;
          c.games.forEach((g) => {
            s.pts += side === 0 ? g.a : g.b;
            s.diff += side === 0 ? g.a - g.b : g.b - g.a;
          });
        });
      });
    });
    const mvps = Object.values(seen)
      .sort((a, b) => b.wins - a.wins || b.diff - a.diff || b.pts - a.pts || a.name.localeCompare(b.name))
      .slice(0, 3);
    const medals = ["🥇", "🥈", "🥉"];
    const podium = mvps.length
      ? '<hr class="divider" /><p class="section-title">MVP race</p>' +
        mvps.map((s, i) =>
          '<div class="podium-row"><span class="medal">' + medals[i] + "</span>" +
          '<span class="p-name"><span class="hdot ' + HOUSES[s.side].key + '"></span>' + esc(s.name) + "</span>" +
          '<span class="p-stat">' + s.wins + (s.wins === 1 ? " win" : " wins") + " · " +
          (s.diff > 0 ? "+" : "") + s.diff + " pts</span></div>").join("")
      : "";

    return '<div class="card glass"><p class="section-title">Cup stats</p>' +
      '<div class="stat-row"><span class="s-label">Closest game</span><span class="s-value">' + gameLine(closest) + "</span></div>" +
      '<div class="stat-row"><span class="s-label">Biggest win</span><span class="s-value">' + gameLine(biggest) + "</span></div>" +
      '<div class="stat-row"><span class="s-label">Golden-point finishes</span><span class="s-value">' + golden + "</span></div>" +
      '<div class="stat-row"><span class="s-label">Rally points won</span><span class="s-value">' +
      '<span class="hdot sm"></span>' + rallyPts[0] + ' &nbsp; <span class="hdot dk"></span>' + rallyPts[1] + "</span></div>" +
      podium + "</div>";
  }

  function celebrate() {
    try {
      if (sessionStorage.getItem("verandas_conf")) return;
      sessionStorage.setItem("verandas_conf", "1");
    } catch (e) {}
    const glyphs = ["🎉", "🏆", "🥒", "✨", "🎊"];
    for (let i = 0; i < 60; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.textContent = glyphs[i % glyphs.length];
      s.style.left = Math.random() * 100 + "vw";
      s.style.animationDuration = (2.5 + Math.random() * 2.5) + "s";
      s.style.animationDelay = (Math.random() * 1.2) + "s";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 6500);
    }
  }

  function renderOverview() {
    const { pts, decided, total } = cupTotals();
    const allDone = decided === total;
    const leader = pts[0] > pts[1] ? 0 : pts[1] > pts[0] ? 1 : null;

    if (allDone && leader != null) celebrate();

    let banner = "";
    if (decided > 0) {
      if (allDone) {
        banner = leader == null
          ? '<div class="lead-banner"><div class="cup">🤝</div><div class="who tie">The houses share the glory</div>' +
            '<div class="txt">level on ' + pts[0] + ' points after all ' + total + " contests</div></div>"
          : '<div class="lead-banner"><div class="cup">👑</div><div class="who ' + HOUSES[leader].key + '">' +
            esc(HOUSES[leader].name) + '</div><div class="txt">claim the throne · ' +
            pts[leader] + " points to " + pts[leader ^ 1] + "</div></div>";
      } else if (leader != null) {
        banner = '<div class="lead-banner"><div class="cup">⚔️</div><div class="who ' + HOUSES[leader].key + '">' +
          esc(HOUSES[leader].name) + ' lead</div><div class="txt">' +
          pts[leader] + " – " + pts[leader ^ 1] + " with " + (total - decided) + " contests to fight</div></div>";
      } else {
        banner = '<div class="lead-banner"><div class="cup">⚔️</div><div class="who tie">All square</div>' +
          '<div class="txt">' + pts[0] + " – " + pts[1] + " with " + (total - decided) + " contests to fight</div></div>";
      }
    }

    const pctSm = decided ? Math.round((pts[0] / total) * 100) : 0;
    const pctDk = decided ? Math.round((pts[1] / total) * 100) : 0;

    const houseCol = (i) =>
      '<div class="house ' + HOUSES[i].key + '"><div class="crest">' + HOUSES[i].crest + "</div>" +
      '<div class="hname">' + esc(HOUSES[i].name) + "</div>" +
      '<div class="score">' + pts[i] + "</div>" +
      '<div class="cats">contests won</div></div>';

    const decidedRows = store.contests.filter((c) => c.done && c.winner != null);
    const recent = decidedRows.length
      ? decidedRows.map((c) => {
          const w = c.winner;
          const scoreline = c.games.length ? c.games.map((g) => g.a + "–" + g.b).join(", ") : "";
          return '<div class="row-item won-' + HOUSES[w].key + '">' +
            '<div class="main"><div class="ttl">' + c.icon + " " + esc(c.name) + "</div>" +
            '<div class="meta">' + esc(playersLabel(c, w)) + " won" + (scoreline ? " · " + scoreline : "") +
            (c.note ? " · “" + esc(c.note) + "”" : "") + "</div></div>" +
            '<span class="pill ' + HOUSES[w].key + '">+1 pt</span></div>';
        }).join("")
      : '<div class="empty"><span class="big">⚔️</span>No contests decided yet.<br/>Record results in the Contests tab.</div>';

    overviewEl.innerHTML =
      '<div class="card glass">' +
      '<div class="h2h">' + houseCol(0) + '<div class="vs">VS</div>' + houseCol(1) + "</div>" +

  function editState(c) {

  function edSideLabel(ed, side) {
    const names = (side === 0 ? ed.playersA : ed.playersB).filter(Boolean);

  // Replay the rally log under the chosen serving rule.
  //  rally:   every rally scores; the winner serves next.
  //  sideout: only the serving side scores. Doubles has server #1 and #2 —
  //           the game opens on the starting team's #2 (the 0–0–2 rule),
  //           losing a rally passes to #2 then sides out to the other team's #1.
  function computeLive(c, ed) {
    const lv = ed.live;
    const doubles = c.kind === "doubles";
    const sideout = lv.rule === "sideout";
    let a = 0, b = 0;
    let serving = lv.firstServer;
    let serverNum = sideout && doubles ? 2 : 1;
    // court positions per team: [player index at RIGHT court, at LEFT court].
    const sp = lv.startPos || [[0, 1], [0, 1]];
    const pos = [sp[0].slice(), sp[1].slice()];
    // the person serving (index into the serving team's player list)
    let serverPerson = doubles ? pos[serving][0] : 0;
    for (const w of lv.log) {
      if (a >= lv.target || b >= lv.target) break;
      if (!sideout) {
        if (w === 0) a++; else b++;
        if (w === serving) {
          if (doubles) pos[w].reverse();       // scored on serve → pair swaps, same server
        } else {
          serving = w;
          if (doubles) {
            const sc = w === 0 ? a : b;        // new server stands in the court matching score parity
            serverPerson = pos[w][sc % 2 === 0 ? 0 : 1];
          }
        }
      } else if (w === serving) {
        if (w === 0) a++; else b++;
        if (doubles) pos[w].reverse();         // scored → swap courts, server keeps serving
      } else if (doubles && serverNum === 1) {
        serverNum = 2;
        serverPerson = 1 - serverPerson;       // partner takes over
      } else {
        serving = w;
        serverNum = 1;
        serverPerson = doubles ? pos[w][0] : 0; // side out: new team's right-court player serves
      }
    }
    const over = a >= lv.target || b >= lv.target;
    const golden = !over && a === lv.target - 1 && b === lv.target - 1;
    const gpSide = a === lv.target - 1 ? 0 : b === lv.target - 1 ? 1 : null;
    const gamePoint = !over && !golden && gpSide != null && (!sideout || serving === gpSide);
    const sScore = serving === 0 ? a : b, rScore = serving === 0 ? b : a;
    const call = !sideout ? a + "–" + b
      : doubles ? sScore + "–" + rScore + "–" + serverNum
      : sScore + "–" + rScore;
    return { a, b, serving, serverNum, doubles, sideout, over, golden, gamePoint, gpSide, call, pos, serverPerson };
  }

  function playerSelect(side, slot, val) {
    const opts = ['<option value="">— player ' + (slot + 1) + " —</option>"].concat(
      roster(side).map((p) => {
        const n = fieldedCount(p);
        const tag = n >= 2 ? " ⚠ " + n + " played" : n === 1 ? " · 1 played" : "";
        return '<option value="' + esc(p) + '"' + (p === val ? " selected" : "") + ">" + esc(p) + tag + "</option>";
      }));
    return '<select data-player="' + side + "-" + slot + '">' + opts.join("") + "</select>";
  }

            : "";

    };
    const FIG = '<svg viewBox="0 0 24 30" aria-hidden="true">' +
      '<circle cx="12" cy="6.5" r="5.5"/>' +
      '<path d="M3.5 29c0-6.6 3.8-10.6 8.5-10.6s8.5 4 8.5 10.6z"/></svg>';
    const chip = (side, idx) => {
      const isServer = !gameOver && st.serving === side &&

      return '<span class="c-fig' + (isServer ? " serving" : "") + '">' + FIG +

        (isServer ? '<span class="fig-ball"></span>' : "") + "</span>";
    };
    // which box (right/left court) holds which player
    const boxes = (side) => {
      if (st.doubles) return { right: chip(side, st.pos[side][0]), left: chip(side, st.pos[side][1]) };
      const servScore = st.serving === 0 ? st.a : st.b;
      const even = servScore % 2 === 0;                 // even score → right court (both players, = diagonal)

      '<button class="btn ghost" id="liveReset"' + (lv.log.length ? "" : " disabled") + ">Reset</button>" +

        '</div><div class="spacer"></div>' +

      : "";

    const header =

    if (isSpecial) {

        '<div class="card glass">' + header + schedRow + specialPick + noteRow +
        '<div class="spacer"></div>' +
        '<button class="btn primary block" id="recordResult">Record result 🏅 (+1 point)</button>' +
        "</div>";
      return;
    }

    const lvS = ed.live;
    const rulesSection =
      '<hr class="divider" />' +
      '<p class="section-title">Game rules</p>' +
      '<div class="field"><label>Rally to</label><div class="seg">' +
      [11, 15, 21].map((t) =>
        '<button data-lt="' + t + '" class="' + (lvS.target === t ? "is-active" : "") + '">' + t + "</button>").join("") +
      "</div></div>" +
      '<div class="two-col">' +
      '<div class="field" style="margin:0;"><label>Scoring</label><div class="seg">' +
      '<button data-lr="rally" class="' + (lvS.rule === "rally" ? "is-active" : "") + '">Every rally</button>' +
      '<button data-lr="sideout" class="' + (lvS.rule === "sideout" ? "is-active" : "") + '">On serve only</button>' +
      "</div></div>" +
      '<div class="field" style="margin:0;"><label>First serve</label><div class="seg">' +
      '<button data-fsv="0" class="' + (lvS.firstServer === 0 ? "is-active" : "") + '">' + esc(HOUSES[0].name.split(" ")[1]) + "</button>" +
      '<button data-fsv="1" class="' + (lvS.firstServer === 1 ? "is-active" : "") + '">' + esc(HOUSES[1].name.split(" ")[1]) + "</button>" +
      "</div></div></div>";

    if (ed.step === "setup") {
