<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1026" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>RallyGlass — Racquet Sports Scoring</title>
  <style>
/* ============================================================
   RallyGlass — Liquid Glass theme (app edition)
   ============================================================ */
:root {
  --glass-bg: rgba(255, 255, 255, 0.10);
  --glass-bg-strong: rgba(255, 255, 255, 0.16);
  --glass-border: rgba(255, 255, 255, 0.28);
  --glass-highlight: rgba(255, 255, 255, 0.55);
  --text: #f4f7ff;
  --text-dim: rgba(233, 238, 255, 0.66);
  --text-faint: rgba(233, 238, 255, 0.42);
  --accent: #7bdcff;
  --accent-2: #b98cff;
  --good: #5ff0b0;
  --gold: #ffd479;
  --bad: #ff7a97;
  --radius: 26px;
  --radius-sm: 16px;
  --shadow: 0 18px 50px rgba(4, 8, 30, 0.45);
  --blur: blur(22px) saturate(180%);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
    Arial, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  color: var(--text);
  background: #0b1026;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ---------- animated backdrop ---------- */
.bg {
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(1200px 800px at 80% -10%, #1b2a6b 0%, transparent 60%),
    radial-gradient(1000px 900px at -10% 110%, #3a1a5e 0%, transparent 55%),
    linear-gradient(160deg, #0b1026 0%, #0e1330 45%, #120a2a 100%);
}
.blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: 0.55; z-index: -1; will-change: transform; }
.b1 { width: 46vmax; height: 46vmax; left: -8vmax; top: -10vmax;
  background: radial-gradient(circle at 30% 30%, #4d7bff, transparent 70%);
  animation: drift1 22s ease-in-out infinite; }
.b2 { width: 40vmax; height: 40vmax; right: -10vmax; top: 8vmax;
  background: radial-gradient(circle at 50% 50%, #b96bff, transparent 70%);
  animation: drift2 26s ease-in-out infinite; }
.b3 { width: 38vmax; height: 38vmax; left: 20vmax; bottom: -16vmax;
  background: radial-gradient(circle at 50% 50%, #2fe0d0, transparent 70%);
  animation: drift3 30s ease-in-out infinite; }
.b4 { width: 30vmax; height: 30vmax; right: 10vmax; bottom: -8vmax;
  background: radial-gradient(circle at 50% 50%, #ff7ac0, transparent 70%);
  animation: drift1 34s ease-in-out infinite reverse; }
@keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(6vmax, 4vmax) scale(1.1); } }
@keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-5vmax, 6vmax) scale(1.08); } }
@keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(4vmax, -5vmax) scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .blob { animation: none; } }

/* ---------- glass surface ---------- */
.glass {
  background: var(--glass-bg);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow),
    inset 0 1px 0 var(--glass-highlight),
    inset 0 -1px 1px rgba(0, 0, 0, 0.18);
}

/* ---------- app chrome ---------- */
.app-header {
  position: sticky; top: 10px; z-index: 20;
  margin: 12px auto 0; max-width: 640px;
  padding: 10px 16px;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  width: calc(100% - 24px);
}
.brand { display: flex; align-items: center; gap: 11px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px;
  display: grid; place-items: center; font-size: 20px;
  background: linear-gradient(150deg, rgba(255,255,255,.25), rgba(255,255,255,.05));
  border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
}
.brand-text h1 { margin: 0; font-size: 17px; letter-spacing: .2px; }
.brand-text p { margin: 1px 0 0; font-size: 11px; color: var(--text-dim); }

.app-main {
  max-width: 640px; margin: 16px auto 0;
  width: calc(100% - 24px);
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}
.tab-panel { display: none; }
.tab-panel.is-active { display: block; animation: fade .3s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- bottom tab bar ---------- */
.bottom-nav {
  position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 40;
  width: min(400px, calc(100% - 24px));
  display: flex; justify-content: space-around; align-items: stretch;
  padding: 8px 8px;
  border-radius: 26px;
  background: rgba(14, 18, 44, 0.55);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow), inset 0 1px 0 var(--glass-highlight);
}
.bnav {
  appearance: none; border: 0; background: transparent; cursor: pointer;
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 7px 4px 6px; border-radius: 18px; color: var(--text-faint);
  font-family: inherit; font-size: 10.5px; font-weight: 700; letter-spacing: .4px;
  transition: all .2s ease;
}
.bnav .ico { font-size: 21px; line-height: 1; filter: grayscale(.6) opacity(.75); transition: all .2s ease; }
.bnav.is-active {
  color: #0b1026;
  background: linear-gradient(150deg, #eaf3ff, #cfe0ff);
  box-shadow: 0 6px 18px rgba(120,170,255,.4);
}
.bnav.is-active .ico { filter: none; }
.bnav:not(.is-active):hover { color: var(--text-dim); }

/* ---------- cards & generic ---------- */
.card { padding: 20px; margin-bottom: 16px; }
.card h2 { margin: 0 0 4px; font-size: 18px; }
.card .sub { margin: 0 0 16px; color: var(--text-dim); font-size: 13px; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--text-faint); margin: 0 0 10px; }

.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-dim);
  margin-bottom: 6px; letter-spacing: .3px; }

input[type="text"], input[type="number"], select {
  width: 100%; color: var(--text); font-size: 15px; font-family: inherit;
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.2);
  transition: border .2s, background .2s;
}
input::placeholder { color: var(--text-faint); }
input:focus, select:focus { outline: none; border-color: var(--accent);
  background: rgba(255,255,255,.13); }
select option { color: #10142c; }

/* segmented control */
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px;
  background: rgba(0,0,0,.2); border: 1px solid rgba(255,255,255,.13); }
.seg button {
  appearance: none; border: 0; cursor: pointer; flex: 1;
  color: var(--text-dim); background: transparent;
  padding: 9px 8px; border-radius: 10px;
  font-family: inherit; font-size: 13px; font-weight: 600;
  transition: all .18s ease; white-space: nowrap;
}
.seg button.is-active {
  color: #0b1026;
  background: linear-gradient(150deg, #eaf3ff, #cfe0ff);
  box-shadow: 0 4px 12px rgba(120,170,255,.3);
}

/* ---------- buttons ---------- */
.btn {
  appearance: none; cursor: pointer; font-family: inherit; font-weight: 600;
  font-size: 15px; color: var(--text); padding: 12px 18px; border-radius: 14px;
  background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  transition: transform .12s ease, background .2s ease;
}
.btn:hover { background: rgba(255,255,255,.22); }
.btn:active { transform: scale(.97); }
.btn.primary {
  color: #0b1026; border-color: transparent;
  background: linear-gradient(150deg, #9be8ff, #a99bff);
  box-shadow: 0 10px 24px rgba(130,150,255,.35), inset 0 1px 0 rgba(255,255,255,.6);
}
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: rgba(255,255,255,.06); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 8px 12px; font-size: 13px; border-radius: 11px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ---------- sport picker ---------- */
.sport-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px,1fr)); gap: 9px; }
.sport-chip {
  cursor: pointer; text-align: left; padding: 12px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16);
  transition: all .18s ease; font-family: inherit; color: var(--text);
}
.sport-chip:hover { background: rgba(255,255,255,.12); }
.sport-chip.is-active {
  border-color: var(--accent);
  background: linear-gradient(150deg, rgba(155,232,255,.22), rgba(169,155,255,.14));
  box-shadow: 0 8px 20px rgba(120,170,255,.25);
}
.sport-chip .ico { font-size: 20px; }
.sport-chip .nm { font-weight: 700; margin-top: 5px; font-size: 13.5px; }

/* ---------- scoreboard ---------- */
.scoreboard { padding: 0; overflow: hidden; }
.sb-top { display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,.12); flex-wrap: wrap; }
.sb-top .meta { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--text-dim); }
.sb-top .meta .ico { font-size: 17px; }
.badge { font-size: 10.5px; padding: 4px 10px; border-radius: 999px;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); color: var(--text-dim); }
.badge.mp { color: #0b1026; font-weight: 800; border: 0;
  background: linear-gradient(150deg, #ffd479, #ffb35c);
  box-shadow: 0 4px 14px rgba(255,190,90,.4);
  animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

.sb-row { display: grid; grid-template-columns: 1fr auto; align-items: center;
  gap: 12px; padding: 16px 18px; }
.sb-row + .sb-row { border-top: 1px solid rgba(255,255,255,.1); }
.sb-row.winner { background: linear-gradient(90deg, rgba(95,240,176,.14), transparent); }
.sb-name { min-width: 0; }
.sb-name .name { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-name .tag { font-size: 10.5px; font-weight: 700; letter-spacing: .5px; margin-top: 2px; }
.sb-name .tag.win { color: var(--good); }
.sb-name .tag.serve { color: var(--accent); }
.serve-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--good); margin-right: 7px; vertical-align: 2px;
  box-shadow: 0 0 8px var(--good); }

.sb-scores { display: flex; align-items: center; gap: 9px; }
.sb-cell { min-width: 28px; text-align: center; }
.sb-cell .lbl { font-size: 8.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .6px; }
.sb-cell .val { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sb-cell.major .val { color: var(--accent); }
.sb-cell.point .val { font-size: 29px; }
.sb-cell.point { padding-left: 5px; }
.sb-sets-done { display: flex; gap: 6px; padding: 12px 18px 0; flex-wrap: wrap; }
.set-chip { font-size: 12px; padding: 4px 10px; border-radius: 8px; font-variant-numeric: tabular-nums;
  background: rgba(0,0,0,.2); border: 1px solid rgba(255,255,255,.12); color: var(--text-dim); }

.sb-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; padding: 15px 18px; }
.point-btn {
  padding: 18px 12px; border-radius: 18px; cursor: pointer; text-align: center;
  border: 1px solid var(--glass-border); box-shadow: inset 0 1px 0 var(--glass-highlight);
  transition: transform .12s, filter .2s; font-family: inherit; color: var(--text);
}
.point-btn:active { transform: scale(.96); }
.point-btn.a { background: linear-gradient(150deg, rgba(123,220,255,.28), rgba(123,220,255,.10)); }
.point-btn.b { background: linear-gradient(150deg, rgba(185,140,255,.28), rgba(185,140,255,.10)); }
.point-btn .pt { font-size: 12px; color: var(--text-dim); }
.point-btn .who { font-size: 15px; font-weight: 700; margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-sub-actions { display: flex; gap: 10px; padding: 0 18px 18px; flex-wrap: wrap; }
.grow { flex: 1 1 auto; }

.winner-banner { text-align: center; padding: 20px 18px 8px; }
.winner-banner .cup { font-size: 38px; }
.winner-banner .who { font-size: 21px; font-weight: 800; margin-top: 6px; }
.winner-banner .txt { color: var(--text-dim); font-size: 13px; margin-top: 4px; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; gap: 9px; }
.row-item {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 15px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
}
.row-item .main { min-width: 0; }
.row-item .ttl { font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; }
.row-item .meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
.row-item.clickable { cursor: pointer; transition: background .18s; }
.row-item.clickable:hover { background: rgba(255,255,255,.12); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
  padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.16); white-space: nowrap; }
.pill.win { color: var(--gold); border-color: rgba(255,212,121,.4); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.team-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px;
  padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.16); }
.team-chip button { appearance: none; background: none; border: 0; color: var(--text-faint);
  cursor: pointer; font-size: 15px; line-height: 1; padding: 0; }
.team-chip button:hover { color: var(--bad); }

.inline-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.inline-form .field { margin: 0; flex: 1 1 130px; }

/* ---------- standings table ---------- */
.table-wrap { overflow-x: auto; border-radius: var(--radius-sm); }
table.standings { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 430px; }
.standings th, .standings td { padding: 10px 10px; text-align: center; }
.standings th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px;
  color: var(--text-faint); font-weight: 700; border-bottom: 1px solid rgba(255,255,255,.14); }
.standings td { border-bottom: 1px solid rgba(255,255,255,.07); font-variant-numeric: tabular-nums; }
.standings td.team { text-align: left; font-weight: 600; }
.standings tr:first-child td .rank { color: var(--gold); }
.rank { display: inline-block; width: 20px; color: var(--text-faint); font-weight: 700; }
.standings td.w { color: var(--good); font-weight: 700; }
.standings td.pts { font-weight: 800; }

/* leaderboard */
.lb-row { display: flex; align-items: center; gap: 12px; padding: 11px 4px;
  border-bottom: 1px solid rgba(255,255,255,.08); }
.lb-row:last-child { border-bottom: 0; }
.lb-rank { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 800; background: rgba(255,255,255,.09);
  border: 1px solid rgba(255,255,255,.16); color: var(--text-dim); flex: none; }
.lb-row.first .lb-rank { color: #0b1026; background: linear-gradient(150deg, #ffd479, #ffb35c); border: 0; }
.lb-name { flex: 1; font-weight: 700; font-size: 14.5px; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-count { font-size: 13px; color: var(--text-dim); white-space: nowrap; }
.lb-bar { height: 6px; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

.champion-banner { text-align: center; padding: 14px 10px 6px; }
.champion-banner .cup { font-size: 34px; }
.champion-banner .who { font-size: 19px; font-weight: 800; margin-top: 4px; color: var(--gold); }
.champion-banner .txt { color: var(--text-dim); font-size: 12.5px; margin-top: 3px; }

/* ---------- misc ---------- */
.empty { text-align: center; color: var(--text-dim); padding: 24px 14px; font-size: 14px; }
.empty .big { font-size: 32px; display: block; margin-bottom: 10px; opacity: .8; }
.divider { height: 1px; background: rgba(255,255,255,.12); margin: 16px 0; border: 0; }
.spacer { height: 8px; }
.hint { font-size: 12px; color: var(--text-faint); margin-top: 8px; line-height: 1.5; }
.back-link { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  color: var(--text-dim); font-size: 14px; margin-bottom: 12px; background: none; border: 0; font-family: inherit; padding: 4px 0; }
.back-link:hover { color: var(--text); }
.opt-block { margin-top: 14px; padding: 14px; border-radius: var(--radius-sm);
  background: rgba(0,0,0,.14); border: 1px solid rgba(255,255,255,.1); }
.opt-block .field:last-child { margin-bottom: 0; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .two-col { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <!-- animated liquid-glass backdrop -->
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span>
    <span class="blob b3"></span><span class="blob b4"></span>
  </div>

  <header class="app-header glass">
    <div class="brand">
      <div class="brand-mark">🎾</div>
      <div class="brand-text">
        <h1>RallyGlass</h1>
        <p>Racquet sports scoring</p>
      </div>
    </div>
  </header>

  <main class="app-main">
    <section id="tab-live" class="tab-panel is-active"></section>
    <section id="tab-tournaments" class="tab-panel"></section>
    <section id="tab-history" class="tab-panel"></section>
  </main>

  <nav class="bottom-nav" role="tablist">
    <button class="bnav is-active" data-tab="live" role="tab"><span class="ico">🎾</span>Live</button>
    <button class="bnav" data-tab="tournaments" role="tab"><span class="ico">🏆</span>Tournaments</button>
    <button class="bnav" data-tab="history" role="tab"><span class="ico">📜</span>History</button>
  </nav>

  <script>
/* ============================================================
   RallyGlass — racquet sports scoring (app edition)
   Live point-by-point scoring · tournaments with categories.
   Vanilla JS, persisted to localStorage. No build step.
   ============================================================ */
(function () {
  "use strict";

  /* ---------------- sport definitions ---------------- */
  // engine "tennis": 15/30/40, games, sets, tiebreak (tennis & padel)
  // engine "race":   rally- or serve-scored games to a target
  const SPORTS = {
    tennis: {
      name: "Tennis", icon: "🎾", engine: "tennis",
      gamesToWin: 6, tiebreakTo: 7,
      tradDesc: "15/30/40 · sets & games · tiebreak at 6-6",
    },
    padel: {
      name: "Padel", icon: "🟡", engine: "tennis",
      gamesToWin: 6, tiebreakTo: 7,
      tradDesc: "Tennis scoring · golden point optional",
    },
    pickleball: {
      name: "Pickleball", icon: "🥒", engine: "race",
      trad: { target: 11, winBy: 2, cap: 0, gamesToWin: 2, serveRule: "sideout" },
      tradDesc: "To 11, win by 2 · point on serve only · best of 3",
    },
    badminton: {
      name: "Badminton", icon: "🏸", engine: "race",
      trad: { target: 21, winBy: 2, cap: 30, gamesToWin: 2, serveRule: "rally" },
      tradDesc: "Rally to 21, cap 30 · best of 3",
    },
    squash: {
      name: "Squash", icon: "🟠", engine: "race",
      trad: { target: 11, winBy: 2, cap: 0, gamesToWin: 3, serveRule: "rally" },
      tradDesc: "Rally to 11, win by 2 · best of 5",
    },
  };

  /* ---------------- storage (+ migration from v1) ---------------- */
  const KEY = "rallyglass_v2";
  const OLD_KEY = "rallyglass_v1";
  const defaultStore = () => ({ live: null, tournaments: [], history: [] });

  function migrateV1(old) {
    const s = defaultStore();
    // old tournaments had flat teams/matches → wrap in one "Open" category
    (old.tournaments || []).forEach((t) => {
      s.tournaments.push({
        id: t.id, name: t.name, date: t.date || Date.now(),
        categories: [{
          id: uid(), name: "Open", sport: t.sport || "tennis",
          teams: t.teams || [], matches: t.matches || [], done: false,
        }],
      });
    });
    (old.history || []).forEach((h) => s.history.push(h));
    if (old.live && old.live.teams) {
      const cfg = SPORTS[old.live.sport];
      if (cfg) {
        s.live = {
          sport: old.live.sport, format: "singles", scoring: "traditional",
          teams: [[old.live.teams[0]], [old.live.teams[1]]],
          firstServer: 0,
          opts: cfg.engine === "tennis"
            ? { bestOf: old.live.bestOf || 3, deuce: "advantage" }
            : {},
          log: (old.live.log || []).slice(), date: old.live.date || Date.now(),
        };
      }
    }
    return s;
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return Object.assign(defaultStore(), JSON.parse(raw));
      const oldRaw = localStorage.getItem(OLD_KEY);
      if (oldRaw) {
        const migrated = migrateV1(JSON.parse(oldRaw));
        localStorage.setItem(KEY, JSON.stringify(migrated));
        return migrated;
      }
    } catch (e) {}
    return defaultStore();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  const esc = (s) =>
    String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const buzz = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

  let store = load();
  const ui = { tab: "live", tournamentId: null, categoryId: null };

  function teamLabel(players, i) {
    const names = (players || []).map((p) => (p || "").trim()).filter(Boolean);
    return names.length ? names.join(" & ") : "Team " + (i + 1);
  }

  /* ============================================================
     SCORING ENGINES
     Recomputed from the rally log (array of 0/1 = rally winner),
     which makes undo trivial and state always consistent.
     ============================================================ */

  function tennisPointLabels(points) {
    const [a, b] = points;
    const names = ["0", "15", "30", "40"];
    if (a >= 3 && b >= 3) {
      if (a === b) return ["40", "40"];
      return a > b ? ["Ad", "40"] : ["40", "Ad"];
    }
    return [names[Math.min(a, 3)], names[Math.min(b, 3)]];
  }

  // opts: { bestOf: 3|5, deuce: "advantage"|"golden" }
  function computeTennis(sportCfg, opts, log, firstServer) {
    const setsToWin = opts.bestOf === 5 ? 3 : 2;
    const G = sportCfg.gamesToWin, TB = sportCfg.tiebreakTo;
    const golden = opts.deuce === "golden";
    let setsWon = [0, 0], games = [0, 0], points = [0, 0];
    let gamesTotal = 0; // total games completed in the match (serve rotation)
    const completedSets = [];
    let complete = false, winner = null;

    for (const w of log) {
      if (complete) break;
      const l = w ^ 1;
      const inTiebreak = games[0] === G && games[1] === G;
      points[w]++;

      if (inTiebreak) {
        if (points[w] >= TB && points[w] - points[l] >= 2) {
          games[w]++; gamesTotal++;
          completedSets.push([games[0], games[1]]);
          setsWon[w]++; games = [0, 0]; points = [0, 0];
          if (setsWon[w] >= setsToWin) { complete = true; winner = w; }
        }
      } else if (points[w] >= 4 && (points[w] - points[l] >= 2 || (golden && points[l] >= 3))) {
        games[w]++; gamesTotal++; points = [0, 0];
        if (games[w] >= G && games[w] - games[l] >= 2) {
          completedSets.push([games[0], games[1]]);
          setsWon[w]++; games = [0, 0];
          if (setsWon[w] >= setsToWin) { complete = true; winner = w; }
        }
      }
    }

    const inTiebreak = games[0] === G && games[1] === G;
    // serve rotation: alternates every game; in a tiebreak the due server
    // serves point 1, then serve changes every two points.
    let server = null;
    if (!complete) {
      const due = firstServer ^ (gamesTotal % 2);
      if (inTiebreak) {
        const p = points[0] + points[1];
        server = due ^ (Math.floor((p + 1) / 2) % 2);
      } else {
        server = due;
      }
    }

    return {
      engine: "tennis", complete, winner, server,
      majorLabel: "Sets", major: setsWon.slice(),
      minorLabel: "Games", minor: games.slice(),
      pointLabel: inTiebreak ? "T-Break" : "Points",
      points: inTiebreak ? points.map(String) : tennisPointLabels(points),
      completed: completedSets.map((s) => s.join("-")),
      unitWord: "set",
    };
  }

  // cfg: { target, winBy(1|2), cap, gamesToWin, serveRule: "rally"|"sideout" }
  function computeRace(cfg, log, firstServer) {
    let gamesWon = [0, 0], points = [0, 0];
    let server = firstServer;
    const completed = [];
    let complete = false, winner = null;

    for (const w of log) {
      if (complete) break;
      const l = w ^ 1;
      // sideout: only the serving side can score; losing the rally
      // hands over the serve without a point.
      const scores = cfg.serveRule === "sideout" ? w === server : true;
      if (scores) points[w]++;
      server = w; // rally winner serves next (side-out on receiver win)

      const reached = points[w] >= cfg.target && points[w] - points[l] >= cfg.winBy;
      const capped = cfg.cap && points[w] >= cfg.cap;
      if (scores && (reached || capped)) {
        gamesWon[w]++;
        completed.push([points[0], points[1]]);
        points = [0, 0];
        if (gamesWon[w] >= cfg.gamesToWin) { complete = true; winner = w; }
        // game winner serves first in the next game (server is already w)
      }
    }

    return {
      engine: "race", complete, winner,
      server: complete ? null : server,
      majorLabel: "Games", major: gamesWon.slice(),
      minorLabel: null, minor: null,
      pointLabel: "Points", points: points.map(String),
      completed: completed.map((s) => s.join("-")),
      unitWord: "game",
    };
  }

  function raceCfgFor(match) {
    const sport = SPORTS[match.sport];
    if (match.scoring === "alternate") {
      const o = match.opts;
      return {
        target: o.target, winBy: o.deuce === "golden" ? 1 : 2, cap: 0,
        gamesToWin: o.gamesToWin, serveRule: o.serveRule,
      };
    }
    return sport.trad;
  }

  function computeMatch(match) {
    const sport = SPORTS[match.sport];
    if (!sport) return null;
    if (match.scoring === "traditional" && sport.engine === "tennis") {
      return computeTennis(sport, match.opts, match.log, match.firstServer);
    }
    return computeRace(raceCfgFor(match), match.log, match.firstServer);
  }

  // which sides currently hold match point (small lookahead)
  function matchPointFor(match, st) {
    if (st.complete) return [];
    const out = [];
    for (const side of [0, 1]) {
      const probe = Object.assign({}, match, { log: match.log.concat([side]) });
      const st2 = computeMatch(probe);
      if (st2.complete && st2.winner === side) out.push(side);
    }
    return out;
  }

  function matchModeDesc(match) {
    const sport = SPORTS[match.sport];
    if (match.scoring === "traditional" && sport.engine === "tennis") {
      return "Best of " + match.opts.bestOf + " sets · " +
        (match.opts.deuce === "golden" ? "golden point" : "advantage");
    }
    const cfg = raceCfgFor(match);
    const bits = ["To " + cfg.target];
    bits.push(cfg.serveRule === "sideout" ? "point on serve" : "rally scoring");
    bits.push(cfg.winBy === 1 ? "golden point" : "win by 2");
    if (cfg.cap) bits.push("cap " + cfg.cap);
    bits.push(cfg.gamesToWin === 1 ? "single game" : "best of " + (cfg.gamesToWin * 2 - 1));
    return bits.join(" · ");
  }

    deuce: "advantage",          // tennis engine: advantage | golden

  function segHtml(id, options, active) {

    const tradOptsHtml = showTradOpts ? (

    const altOptsHtml = showAltOpts ? (

    const nameInput = (idx, label, ph) =>

        "</div>";

    liveEl.innerHTML =
      '<div class="card glass">' +
      "<h2>New match</h2>" +
      '<p class="sub">' + esc(draft.scoring === "traditional" ? sport.tradDesc : "Custom rules — set them below.") + "</p>" +
      '<p class="section-title">Sport</p>' +
      '<div class="sport-grid">' + sportChips + "</div>" +
      '<div class="spacer"></div>' +
      '<div class="two-col" style="margin-top:8px;">' +
      '<div class="field"><label>Format</label>' +

      '<div class="field"><label>Scoring</label>' +

      "</div>" +
      tradOptsHtml + altOptsHtml +
      '<hr class="divider" />' +
      namesHtml +
      '<div class="field"><label>First serve</label>' +
      segHtml("firstServer", [
        { val: 0, label: esc(teamLabel([draft.names[0], doubles ? draft.names[1] : ""], 0)) },
        { val: 1, label: esc(teamLabel([draft.names[2], doubles ? draft.names[3] : ""], 1)) },
      ], draft.firstServer) + "</div>" +
      '<div class="spacer"></div>' +
      '<button class="btn primary block" id="startMatch">Start scoring</button>' +

  }

  function renderScoreboard() {
    const m = store.live;
    const sport = SPORTS[m.sport];
    const st = computeMatch(m);
    const mp = matchPointFor(m, st);
    const labels = [teamLabel(m.teams[0], 0), teamLabel(m.teams[1], 1)];

    const cell = (label, val, cls) =>
      '<div class="sb-cell ' + (cls || "") + '"><div class="lbl">' + label + '</div><div class="val">' + val + "</div></div>";

    const scoreCells = (side) => {
      let cells = "";
      if (st.minor) cells += cell(st.minorLabel, st.minor[side], "");
      cells += cell(st.majorLabel, st.major[side], "major");
      if (!st.complete) cells += cell(st.pointLabel, st.points[side], "point");
      return cells;
    };

    const row = (side) => {
      const isWinner = st.complete && st.winner === side;
      const serving = !st.complete && st.server === side;
      return '<div class="sb-row' + (isWinner ? " winner" : "") + '">' +
        '<div class="sb-name"><div class="name">' + (serving ? '<span class="serve-dot"></span>' : "") + esc(labels[side]) + "</div>" +
        (isWinner ? '<div class="tag win">WINNER</div>' : serving ? '<div class="tag serve">SERVING</div>' : "") +
        '</div><div class="sb-scores">' + scoreCells(side) + "</div></div>";
    };

    const setsDone = st.completed.length
      ? '<div class="sb-sets-done">' + st.completed.map((s, i) =>
          '<span class="set-chip">' + (st.unitWord === "set" ? "Set" : "Game") + " " + (i + 1) + ": " + s + "</span>").join("") + "</div>"
      : "";

    const mpBadge = mp.length
      ? '<span class="badge mp">' + (mp.length === 2 ? "Match point — both!" : "Match point · " + esc(labels[mp[0]])) + "</span>"
      : "";

    let bottom;
    if (st.complete) {
      bottom =
        '<div class="winner-banner"><div class="cup">🏆</div>' +
        '<div class="who">' + esc(labels[st.winner]) + "</div>" +
        '<div class="txt">wins the match · ' + esc(st.completed.join(", ") || st.major.join("-")) + "</div></div>" +
        '<div class="sb-sub-actions">' +
        '<button class="btn primary grow" id="saveResult">Save result</button>' +
        '<button class="btn ghost" id="undoPoint">Undo</button>' +
        '<button class="btn danger" id="discardMatch">Discard</button></div>';
    } else {
      const rallyWord = (m.scoring === "alternate" ? m.opts.serveRule : (sport.trad && sport.trad.serveRule)) === "sideout"
        ? "+ Rally won" : "+ Point";
      bottom =
        '<div class="sb-actions">' +
        '<button class="point-btn a" data-point="0"><div class="pt">' + rallyWord + '</div><div class="who">' + esc(labels[0]) + "</div></button>" +
        '<button class="point-btn b" data-point="1"><div class="pt">' + rallyWord + '</div><div class="who">' + esc(labels[1]) + "</div></button>" +
        "</div>" +
        '<div class="sb-sub-actions">' +
        '<button class="btn ghost grow" id="undoPoint"' + (m.log.length ? "" : " disabled") + ">↩︎ Undo</button>" +
        '<button class="btn danger" id="discardMatch">End match</button></div>';
    }

    liveEl.innerHTML =
      '<div class="card glass scoreboard">' +
      '<div class="sb-top">' +
      '<div class="meta"><span class="ico">' + sport.icon + "</span> " + sport.name +
      " · " + (m.format === "doubles" ? "Doubles" : "Singles") + "</div>" +
      mpBadge +
      '<span class="badge">' + esc(matchModeDesc(m)) + "</span>" +
      "</div>" +
      row(0) + row(1) + setsDone + bottom +
      "</div>";
  }

  /* ---- live actions ---- */
  function startMatch() {
    const doubles = draft.format === "doubles";
    const n = draft.names.map((x) => (x || "").trim());
    const teams = doubles
      ? [[n[0] || "Player A1", n[1] || "Player A2"], [n[2] || "Player B1", n[3] || "Player B2"]]
      : [[n[0] || "Player 1"], [n[2] || "Player 2"]];

    const sport = SPORTS[draft.sport];
    let opts = {};
    if (draft.scoring === "alternate") {
      const target = Math.max(1, Math.min(99, parseInt(draft.alt.target, 10) || 11));
      opts = { target, gamesToWin: draft.alt.gamesToWin, serveRule: draft.alt.serveRule, deuce: draft.alt.deuce };
    } else if (sport.engine === "tennis") {
      opts = { bestOf: draft.bestOf, deuce: draft.deuce };
    }

    store.live = {
      sport: draft.sport, format: draft.format, scoring: draft.scoring,
      teams, opts, firstServer: draft.firstServer, log: [], date: Date.now(),
    };
    save();
    renderLive();
  }

  function addPoint(side) {
    const m = store.live;
    if (!m) return;
    if (computeMatch(m).complete) return;
    m.log.push(side);
    buzz(12);
    save();
    renderLive();
  }

  function undoPoint() {
    const m = store.live;
    if (!m || !m.log.length) return;
    m.log.pop();
    save();
    renderLive();
  }

  function saveResult() {
    const m = store.live;
    const st = computeMatch(m);
    if (!m || !st.complete) return;
    store.history.unshift({
      id: uid(), sport: m.sport, format: m.format, scoring: m.scoring,
      winnerName: teamLabel(m.teams[st.winner], st.winner),
      loserName: teamLabel(m.teams[st.winner ^ 1], st.winner ^ 1),
      score: st.completed.join(", ") || st.major.join("-"),
      mode: matchModeDesc(m),
      date: Date.now(),
    });
    store.history = store.history.slice(0, 100);
    store.live = null;
    save();
    renderLive();
    renderHistory();
  }

  function discardMatch() {
    if (store.live && store.live.log.length && !confirm("End and discard this match?")) return;
    store.live = null;
    save();
    renderLive();
  }

  liveEl.addEventListener("click", (e) => {
    const sportBtn = e.target.closest("[data-sport]");
    if (sportBtn) { draft.sport = sportBtn.dataset.sport; renderLive(); return; }

    const segBtn = e.target.closest(".seg button");
    if (segBtn) {
      const seg = segBtn.closest("[data-seg]").dataset.seg;
      const val = segBtn.dataset.val;
      if (seg === "format") draft.format = val;
      else if (seg === "scoring") draft.scoring = val;
      else if (seg === "bestOf") draft.bestOf = parseInt(val, 10);
      else if (seg === "deuce") draft.deuce = val;
      else if (seg === "altGames") draft.alt.gamesToWin = parseInt(val, 10);
      else if (seg === "altServe") draft.alt.serveRule = val;
      else if (seg === "altDeuce") draft.alt.deuce = val;
      else if (seg === "firstServer") draft.firstServer = parseInt(val, 10);
      renderLive(); return;
    }

    const pointBtn = e.target.closest("[data-point]");
    if (pointBtn) { addPoint(parseInt(pointBtn.dataset.point, 10)); return; }

    if (e.target.closest("#startMatch")) return startMatch();
    if (e.target.closest("#undoPoint")) return undoPoint();
    if (e.target.closest("#saveResult")) return saveResult();
    if (e.target.closest("#discardMatch")) return discardMatch();
  });

  // keep typed values in the draft so segmented re-renders don't wipe them
  liveEl.addEventListener("input", (e) => {
    const nameIdx = e.target.dataset && e.target.dataset.name;
    if (nameIdx != null && nameIdx !== "") draft.names[+nameIdx] = e.target.value;
    if (e.target.id === "altTarget") draft.alt.target = e.target.value;
  });
  liveEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.matches("[data-name]")) { e.preventDefault(); startMatch(); }
  });

  /* ============================================================
     TOURNAMENTS TAB — tournaments → categories → results
     ============================================================ */
  const tourEl = document.getElementById("tab-tournaments");

  const findTournament = (id) => store.tournaments.find((t) => t.id === id);
  const findCategory = (t, id) => t && t.categories.find((c) => c.id === id);

  function computeStandings(cat) {
    const table = {};
    cat.teams.forEach((name) => { table[name] = { name, P: 0, W: 0, L: 0, PF: 0, PA: 0 }; });
    cat.matches.forEach((mt) => {
      const A = table[mt.teamA], B = table[mt.teamB];
      if (!A || !B) return;
      A.P++; B.P++;
      A.PF += mt.scoreA; A.PA += mt.scoreB;
      B.PF += mt.scoreB; B.PA += mt.scoreA;
      if (mt.scoreA > mt.scoreB) { A.W++; B.L++; } else { B.W++; A.L++; }
    });
    return Object.values(table).sort((a, b) =>
      b.W - a.W || (b.PF - b.PA) - (a.PF - a.PA) || b.PF - a.PF || a.name.localeCompare(b.name));
  }

  function categoryLeader(cat) {
    if (!cat.matches.length) return null;
    const s = computeStandings(cat);
    return s.length ? s[0].name : null;
  }

  // team → number of finished categories won
  function categoryWins(t) {
    const wins = {};
    t.categories.forEach((c) => {
      if (!c.done) return;
      const w = categoryLeader(c);
      if (w) wins[w] = (wins[w] || 0) + 1;
    });
    return Object.entries(wins)
      .map(([name, n]) => ({ name, n }))
      .sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
  }

  function renderTournaments() {
    const t = ui.tournamentId && findTournament(ui.tournamentId);
    if (!t) { ui.tournamentId = null; ui.categoryId = null; return renderTournamentList(); }
    const c = ui.categoryId && findCategory(t, ui.categoryId);
    if (c) return renderCategory(t, c);
    ui.categoryId = null;
    renderTournamentDetail(t);
  }

  /* ---- level 1: list ---- */
  function renderTournamentList() {
    const list = store.tournaments.length
      ? store.tournaments.map((t) => {
          const done = t.categories.filter((c) => c.done).length;

            '<span class="pill">Open →</span></div>';
        }).join("")
      : '<div class="empty"><span class="big">🏆</span>No tournaments yet.<br/>Create one above — add categories, teams and results.</div>';

    tourEl.innerHTML =
      '<div class="card glass"><h2>Create a tournament</h2>' +
      '<p class="sub">A tournament holds categories (e.g. Men’s Singles, Mixed Doubles). Whoever wins the most categories wins the tournament.</p>' +
      '<div class="inline-form"><div class="field grow"><label>Tournament name</label>' +
      '<input type="text" id="tName" placeholder="e.g. Summer Club Championship" maxlength="60" /></div>' +
      '<button class="btn primary" id="createTournament">Create</button></div></div>' +
      '<div class="card glass"><p class="section-title">Your tournaments</p><div class="spacer"></div>' +
      '<div class="list">' + list + "</div></div>";
  }

  /* ---- level 2: tournament overview ---- */
  function renderTournamentDetail(t) {
    const sportOptions = Object.entries(SPORTS)
      .map(([k, s]) => '<option value="' + k + '">' + s.icon + " " + s.name + "</option>").join("");

    const catRows = t.categories.length
      ? t.categories.map((c) => {
          const icon = (SPORTS[c.sport] || {}).icon || "🎾";
          const leader = categoryLeader(c);
          const status = c.done
            ? '<span class="pill win">🏅 ' + esc(leader || "—") + "</span>"
            : leader
              ? '<span class="pill">Leading: ' + esc(leader) + "</span>"
              : '<span class="pill">Not started</span>';
          return '<div class="row-item clickable" data-open-cat="' + c.id + '">' +
            '<div class="main"><div class="ttl">' + icon + " " + esc(c.name) + "</div>" +
            '<div class="meta">' + c.teams.length + " teams · " + c.matches.length + " matches" +
            (c.done ? " · finished" : "") + "</div></div>" + status + "</div>";
        }).join("")
      : '<div class="empty">No categories yet — add the first one above.</div>';

    const wins = categoryWins(t);
    const total = t.categories.length;
    const allDone = total > 0 && t.categories.every((c) => c.done);
    const maxWins = wins.length ? wins[0].n : 0;
    const champs = wins.filter((w) => w.n === maxWins);
    const champBanner = allDone && wins.length
      ? '<div class="champion-banner"><div class="cup">👑</div>' +
        '<div class="who">' + champs.map((c) => esc(c.name)).join(" & ") + "</div>" +
        '<div class="txt">' + (champs.length > 1 ? "share the title" : "wins the tournament") +
        " · " + maxWins + " of " + total + " categories</div></div>"
      : "";

    const lbRows = wins.length
      ? wins.map((w, i) =>
          '<div class="lb-row' + (i === 0 ? " first" : "") + '">' +
          '<div class="lb-rank">' + (i + 1) + "</div>" +
          '<div class="lb-name">' + esc(w.name) + "</div>" +
          '<div class="lb-bar" style="width:' + Math.round((w.n / Math.max(maxWins, 1)) * 70) + 'px;"></div>' +
          '<div class="lb-count">' + w.n + " " + (w.n === 1 ? "category" : "categories") + "</div></div>").join("")
      : '<div class="empty">Finish a category to put its winner on the board.</div>';

    tourEl.innerHTML =
      '<button class="back-link" id="backToList">← All tournaments</button>' +
      '<div class="card glass">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">' +
      "<div><h2>🏆 " + esc(t.name) + "</h2>" +
      '<p class="sub">' + total + " categories · most category wins takes the title</p></div>" +
      '<button class="btn danger small" id="deleteTournament">Delete</button></div>' +
      champBanner +
      '<p class="section-title">Leaderboard — category wins</p>' + lbRows +
      "</div>" +
      '<div class="card glass"><p class="section-title">Add a category</p>' +
      '<div class="inline-form"><div class="field grow"><label>Category name</label>' +
      '<input type="text" id="catName" placeholder="e.g. Men’s Singles" maxlength="50" /></div>' +
      '<div class="field"><label>Sport</label><select id="catSport">' + sportOptions + "</select></div>" +
      '<button class="btn primary" id="addCategory">Add</button></div></div>' +
      '<div class="card glass"><p class="section-title">Categories</p><div class="spacer"></div>' +
      '<div class="list">' + catRows + "</div></div>";
  }

  /* ---- level 3: category ---- */
  function renderCategory(t, c) {
    const sport = SPORTS[c.sport] || SPORTS.tennis;

    const teamChips = c.teams.length
      ? c.teams.map((name) =>
          '<span class="team-chip">' + esc(name) +
          '<button data-remove-team="' + esc(name) + '" title="Remove">×</button></span>').join("")
      : '<span class="hint">No teams yet — add your first team above.</span>';

    const teamSelect = c.teams.map((n) => '<option value="' + esc(n) + '">' + esc(n) + "</option>").join("");
    const canRecord = c.teams.length >= 2 && !c.done;

    const matchList = c.matches.length
      ? c.matches.slice().reverse().map((mt) => {
          const aWon = mt.scoreA > mt.scoreB;
          return '<div class="row-item"><div class="main"><div class="ttl">' +
            '<span style="color:' + (aWon ? "var(--good)" : "inherit") + '">' + esc(mt.teamA) + "</span>" +
            '<span style="color:var(--text-faint)"> ' + mt.scoreA + " – " + mt.scoreB + " </span>" +
            '<span style="color:' + (!aWon ? "var(--good)" : "inherit") + '">' + esc(mt.teamB) + "</span></div>" +
            '<div class="meta">' + new Date(mt.date).toLocaleDateString() + "</div></div>" +
            (c.done ? "" : '<button class="btn ghost small" data-del-match="' + mt.id + '">Delete</button>') +
            "</div>";
        }).join("")
      : '<div class="empty">No matches recorded yet.</div>';

    const standings = computeStandings(c);
    const standingsRows = standings.map((s, i) =>
      "<tr><td class=\"team\"><span class=\"rank\">" + (i + 1) + "</span>" + esc(s.name) + "</td>" +
      "<td>" + s.P + '</td><td class="w">' + s.W + "</td><td>" + s.L + "</td>" +
      "<td>" + s.PF + "</td><td>" + s.PA + "</td>" +
      "<td>" + (s.PF - s.PA > 0 ? "+" : "") + (s.PF - s.PA) + "</td>" +
      '<td class="pts">' + s.W * 2 + "</td></tr>").join("");

    const winner = categoryLeader(c);
    const doneBanner = c.done
      ? '<div class="champion-banner"><div class="cup">🏅</div>' +
        '<div class="who">' + esc(winner || "—") + "</div>" +
        '<div class="txt">wins ' + esc(c.name) + "</div></div>"
      : "";

    tourEl.innerHTML =
      '<button class="back-link" id="backToTournament">← ' + esc(t.name) + "</button>" +
      '<div class="card glass">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">' +
      "<div><h2>" + sport.icon + " " + esc(c.name) + "</h2>" +
      '<p class="sub">' + sport.name + " · " + c.teams.length + " teams · " + c.matches.length + " matches</p></div>" +
      '<div style="display:flex;gap:8px;">' +
      '<button class="btn small ' + (c.done ? "ghost" : "primary") + '" id="toggleDone"' +
      (!c.done && !c.matches.length ? " disabled" : "") + ">" +
      (c.done ? "Reopen" : "Finish category") + "</button>" +
      '<button class="btn danger small" id="deleteCategory">Delete</button></div></div>' +
      doneBanner +
      (c.done ? "" :
        '<p class="section-title">Teams</p>' +
        '<div class="inline-form"><div class="field grow"><label>Add a team</label>' +
        '<input type="text" id="teamName" placeholder="Team or player name" maxlength="40" /></div>' +
        '<button class="btn" id="addTeam">Add team</button></div>' +
        '<div class="spacer"></div><div class="chips">' + teamChips + "</div>") +
      "</div>" +
      '<div class="card glass"><p class="section-title">Record a result</p>' +
      (canRecord
        ? '<div class="inline-form">' +
          '<div class="field"><label>Team 1</label><select id="mTeamA">' + teamSelect + "</select></div>" +
          '<div class="field" style="flex:0 0 80px;"><label>Score</label><input type="number" id="mScoreA" min="0" step="1" placeholder="0" /></div>' +
          '<div class="field" style="flex:0 0 80px;"><label>Score</label><input type="number" id="mScoreB" min="0" step="1" placeholder="0" /></div>' +
          '<div class="field"><label>Team 2</label><select id="mTeamB">' + teamSelect + "</select></div></div>" +
          '<div class="spacer"></div><button class="btn primary" id="recordMatch">Add result</button>' +
          '<p class="hint">Enter the final score (sets, games or points won). The higher score wins.</p>'
        : c.done
          ? '<div class="empty">Category finished — reopen it to record more results.</div>'
          : '<div class="empty">Add at least two teams to start recording results.</div>') +
      "</div>" +
      '<div class="card glass"><p class="section-title">Standings</p><div class="spacer"></div>' +
      (standings.length
        ? '<div class="table-wrap"><table class="standings"><thead><tr>' +
          '<th style="text-align:left;">Team</th><th>P</th><th>W</th><th>L</th><th>PF</th><th>PA</th><th>Diff</th><th>Pts</th>' +
          "</tr></thead><tbody>" + standingsRows + "</tbody></table></div>" +
          '<p class="hint">P played · W won · L lost · PF/PA points for & against · Pts = 2 per win.</p>'
        : '<div class="empty">Standings appear once teams are added.</div>') +
      "</div>" +
      '<div class="card glass"><p class="section-title">Match history</p><div class="spacer"></div>' +
      '<div class="list">' + matchList + "</div></div>";
  }

  /* ---- tournament actions ---- */
  function createTournament() {
    const name = (document.getElementById("tName").value || "").trim();
    if (!name) { alert("Please enter a tournament name."); return; }
    const t = { id: uid(), name, date: Date.now(), categories: [] };
    store.tournaments.unshift(t);
    ui.tournamentId = t.id;
    save();
    renderTournaments();
  }

  function addCategory(t) {
    const name = (document.getElementById("catName").value || "").trim();
    const sport = document.getElementById("catSport").value;
    if (!name) { alert("Please enter a category name."); return; }
    const c = { id: uid(), name, sport, teams: [], matches: [], done: false };
    t.categories.push(c);
    ui.categoryId = c.id;
    save();
    renderTournaments();
  }

  function addTeam(c) {
    const input = document.getElementById("teamName");
    const name = (input.value || "").trim();
    if (!name) return;
    if (c.teams.some((n) => n.toLowerCase() === name.toLowerCase())) {
      alert("That team is already in this category."); return;
    }
    c.teams.push(name);
    save();
    renderTournaments();
  }

  function recordMatch(c) {
    const teamA = document.getElementById("mTeamA").value;
    const teamB = document.getElementById("mTeamB").value;
    const scoreA = parseInt(document.getElementById("mScoreA").value, 10);
    const scoreB = parseInt(document.getElementById("mScoreB").value, 10);
    if (teamA === teamB) { alert("Pick two different teams."); return; }
    if (isNaN(scoreA) || isNaN(scoreB)) { alert("Enter a score for both teams."); return; }
    if (scoreA === scoreB) { alert("A match can't end in a tie — enter a winning score."); return; }
    c.matches.push({ id: uid(), teamA, teamB, scoreA, scoreB, date: Date.now() });
    save();
    renderTournaments();
  }

  tourEl.addEventListener("click", (e) => {
    if (e.target.closest("#createTournament")) return createTournament();

    const openBtn = e.target.closest("[data-open]");
    if (openBtn) { ui.tournamentId = openBtn.dataset.open; renderTournaments(); return; }
    if (e.target.closest("#backToList")) { ui.tournamentId = null; ui.categoryId = null; renderTournaments(); return; }

    const t = ui.tournamentId && findTournament(ui.tournamentId);
    if (!t) return;

    if (e.target.closest("#backToTournament")) { ui.categoryId = null; renderTournaments(); return; }
    if (e.target.closest("#addCategory")) return addCategory(t);
    if (e.target.closest("#deleteTournament")) {
      if (confirm('Delete "' + t.name + '" and all its categories?')) {
        store.tournaments = store.tournaments.filter((x) => x.id !== t.id);
        ui.tournamentId = null; save(); renderTournaments();
      }
      return;
    }

    const openCat = e.target.closest("[data-open-cat]");
    if (openCat) { ui.categoryId = openCat.dataset.openCat; renderTournaments(); return; }

    const c = ui.categoryId && findCategory(t, ui.categoryId);
    if (!c) return;

    if (e.target.closest("#addTeam")) return addTeam(c);
    if (e.target.closest("#recordMatch")) return recordMatch(c);
    if (e.target.closest("#toggleDone")) {
      c.done = !c.done; save(); renderTournaments(); return;
    }
    if (e.target.closest("#deleteCategory")) {
      if (confirm('Delete category "' + c.name + '"?')) {
        t.categories = t.categories.filter((x) => x.id !== c.id);
        ui.categoryId = null; save(); renderTournaments();
      }
      return;
    }

    const rmTeam = e.target.closest("[data-remove-team]");
    if (rmTeam) {
      c.teams = c.teams.filter((n) => n !== rmTeam.dataset.removeTeam);
      save(); renderTournaments(); return;
    }
    const delMatch = e.target.closest("[data-del-match]");
    if (delMatch) {
      c.matches = c.matches.filter((m) => m.id !== delMatch.dataset.delMatch);
      save(); renderTournaments(); return;
    }
  });

  tourEl.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const t = ui.tournamentId && findTournament(ui.tournamentId);
    if (e.target.id === "tName") { e.preventDefault(); createTournament(); }
    else if (e.target.id === "catName" && t) { e.preventDefault(); addCategory(t); }
    else if (e.target.id === "teamName" && t) {
      const c = ui.categoryId && findCategory(t, ui.categoryId);
      if (c) { e.preventDefault(); addTeam(c); }
    }
  });

  /* ============================================================
     HISTORY TAB
     ============================================================ */
  const histEl = document.getElementById("tab-history");

  function renderHistory() {
    const items = store.history.length
      ? store.history.map((h) => {
          const icon = (SPORTS[h.sport] || {}).icon || "🎾";
          return '<div class="row-item"><div class="main">' +
            '<div class="ttl">' + icon + " " + esc(h.winnerName) +
            ' <span style="color:var(--text-faint)">def.</span> ' + esc(h.loserName) + "</div>" +
            '<div class="meta">' + esc(h.score) +
            (h.format ? " · " + h.format : "") +
            (h.mode ? " · " + esc(h.mode) : "") +
            " · " + new Date(h.date).toLocaleDateString() + "</div></div>" +
            '<button class="btn ghost small" data-del-hist="' + h.id + '">×</button></div>';
        }).join("")
      : '<div class="empty"><span class="big">📜</span>No saved matches yet.<br/>Finish a live match and save the result.</div>';

    histEl.innerHTML =
      '<div class="card glass">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;">' +
      "<h2>Match history</h2>" +
      (store.history.length ? '<button class="btn ghost small" id="clearHistory">Clear all</button>' : "") +
      "</div>" +
      '<p class="sub">Every match saved from live scoring.</p>' +
      '<div class="list">' + items + "</div></div>";
  }

  histEl.addEventListener("click", (e) => {
    if (e.target.closest("#clearHistory")) {
      if (confirm("Clear all saved matches?")) { store.history = []; save(); renderHistory(); }
      return;
    }
    const del = e.target.closest("[data-del-hist]");
    if (del) {
      store.history = store.history.filter((h) => h.id !== del.dataset.delHist);
      save(); renderHistory();
    }
  });

  /* ============================================================
     BOTTOM NAV + BOOT
     ============================================================ */
  document.querySelectorAll(".bnav").forEach((btn) => {
    btn.addEventListener("click", () => {
      ui.tab = btn.dataset.tab;
      buzz(8);
      document.querySelectorAll(".bnav").forEach((b) => b.classList.toggle("is-active", b === btn));
      document.querySelectorAll(".tab-panel").forEach((p) =>
        p.classList.toggle("is-active", p.id === "tab-" + ui.tab));
      if (ui.tab === "live") renderLive();
      else if (ui.tab === "tournaments") renderTournaments();
      else renderHistory();
    });
  });

  renderLive();
  renderTournaments();
  renderHistory();
})();
  </script>
</body>
</html>
