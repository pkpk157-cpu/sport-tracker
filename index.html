<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1026" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>RallyGlass — Tournament Scores</title>
  <style>
/* ============================================================
   RallyGlass — Liquid Glass theme (tournament edition)
   ============================================================ */
:root {
  --glass-bg: rgba(255, 255, 255, 0.10);
  --glass-bg-strong: rgba(255, 255, 255, 0.16);
  --glass-border: rgba(255, 255, 255, 0.28);
  --glass-highlight: rgba(255, 255, 255, 0.55);
  --text: #f4f7ff;
  --text-dim: rgba(233, 238, 255, 0.66);
  --text-faint: rgba(233, 238, 255, 0.42);
  --accent: #7bdcff;
  --accent-2: #b98cff;
  --good: #5ff0b0;
  --gold: #ffd479;
  --bad: #ff7a97;
  --radius: 26px;
  --radius-sm: 16px;
  --shadow: 0 18px 50px rgba(4, 8, 30, 0.45);
  --blur: blur(22px) saturate(180%);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
    Arial, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  color: var(--text);
  background: #0b1026;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ---------- animated backdrop ---------- */
.bg {
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(1200px 800px at 80% -10%, #1b2a6b 0%, transparent 60%),
    radial-gradient(1000px 900px at -10% 110%, #3a1a5e 0%, transparent 55%),
    linear-gradient(160deg, #0b1026 0%, #0e1330 45%, #120a2a 100%);
}
.blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: 0.55; z-index: -1; will-change: transform; }
.b1 { width: 46vmax; height: 46vmax; left: -8vmax; top: -10vmax;
  background: radial-gradient(circle at 30% 30%, #4d7bff, transparent 70%);
  animation: drift1 22s ease-in-out infinite; }
.b2 { width: 40vmax; height: 40vmax; right: -10vmax; top: 8vmax;
  background: radial-gradient(circle at 50% 50%, #b96bff, transparent 70%);
  animation: drift2 26s ease-in-out infinite; }
.b3 { width: 38vmax; height: 38vmax; left: 20vmax; bottom: -16vmax;
  background: radial-gradient(circle at 50% 50%, #2fe0d0, transparent 70%);
  animation: drift3 30s ease-in-out infinite; }
.b4 { width: 30vmax; height: 30vmax; right: 10vmax; bottom: -8vmax;
  background: radial-gradient(circle at 50% 50%, #ff7ac0, transparent 70%);
  animation: drift1 34s ease-in-out infinite reverse; }
@keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(6vmax, 4vmax) scale(1.1); } }
@keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-5vmax, 6vmax) scale(1.08); } }
@keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(4vmax, -5vmax) scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .blob { animation: none; } }

/* ---------- glass surface ---------- */
.glass {
  background: var(--glass-bg);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow),
    inset 0 1px 0 var(--glass-highlight),
    inset 0 -1px 1px rgba(0, 0, 0, 0.18);
}

/* ---------- app chrome ---------- */
.app-header {
  position: sticky; top: 10px; z-index: 20;
  margin: 12px auto 0; max-width: 640px;
  padding: 10px 16px;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  width: calc(100% - 24px);
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px; flex: none;
  display: grid; place-items: center; font-size: 20px;
  background: linear-gradient(150deg, rgba(255,255,255,.25), rgba(255,255,255,.05));
  border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
}
.brand-text { min-width: 0; }
.brand-text h1 { margin: 0; font-size: 17px; letter-spacing: .2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-text p { margin: 1px 0 0; font-size: 11px; color: var(--text-dim); }

.app-main {
  max-width: 640px; margin: 16px auto 0;
  width: calc(100% - 24px);
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}
.tab-panel { display: none; }
.tab-panel.is-active { display: block; animation: fade .3s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- bottom tab bar ---------- */
.bottom-nav {
  position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 40;
  width: min(400px, calc(100% - 24px));
  display: flex; justify-content: space-around; align-items: stretch;
  padding: 8px 8px;
  border-radius: 26px;
  background: rgba(14, 18, 44, 0.55);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow), inset 0 1px 0 var(--glass-highlight);
}
.bnav {
  appearance: none; border: 0; background: transparent; cursor: pointer;
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 7px 4px 6px; border-radius: 18px; color: var(--text-faint);
  font-family: inherit; font-size: 10.5px; font-weight: 700; letter-spacing: .4px;
  transition: all .2s ease;
}
.bnav .ico { font-size: 21px; line-height: 1; filter: grayscale(.6) opacity(.75); transition: all .2s ease; }
.bnav.is-active {
  color: #0b1026;
  background: linear-gradient(150deg, #eaf3ff, #cfe0ff);
  box-shadow: 0 6px 18px rgba(120,170,255,.4);
}
.bnav.is-active .ico { filter: none; }
.bnav:not(.is-active):hover { color: var(--text-dim); }

/* ---------- cards & generic ---------- */
.card { padding: 20px; margin-bottom: 16px; }
.card h2 { margin: 0 0 4px; font-size: 18px; }
.card .sub { margin: 0 0 16px; color: var(--text-dim); font-size: 13px; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--text-faint); margin: 0 0 10px; }

.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-dim);
  margin-bottom: 6px; letter-spacing: .3px; }

input[type="text"], input[type="number"], select {
  width: 100%; color: var(--text); font-size: 15px; font-family: inherit;
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.2);
  transition: border .2s, background .2s;
}
input::placeholder { color: var(--text-faint); }
input:focus, select:focus { outline: none; border-color: var(--accent);
  background: rgba(255,255,255,.13); }
select option { color: #10142c; }

/* ---------- buttons ---------- */
.btn {
  appearance: none; cursor: pointer; font-family: inherit; font-weight: 600;
  font-size: 15px; color: var(--text); padding: 12px 18px; border-radius: 14px;
  background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  transition: transform .12s ease, background .2s ease;
}
.btn:hover { background: rgba(255,255,255,.22); }
.btn:active { transform: scale(.97); }
.btn.primary {
  color: #0b1026; border-color: transparent;
  background: linear-gradient(150deg, #9be8ff, #a99bff);
  box-shadow: 0 10px 24px rgba(130,150,255,.35), inset 0 1px 0 rgba(255,255,255,.6);
}
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: rgba(255,255,255,.06); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 8px 12px; font-size: 13px; border-radius: 11px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; gap: 9px; }
.row-item {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 15px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
}
.row-item .main { min-width: 0; }
.row-item .ttl { font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; }
.row-item .meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
.row-item.clickable { cursor: pointer; transition: background .18s; }
.row-item.clickable:hover { background: rgba(255,255,255,.12); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
  padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.16); white-space: nowrap; }
.pill.win { color: var(--gold); border-color: rgba(255,212,121,.4); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.team-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px;
  padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.16); }
.team-chip button { appearance: none; background: none; border: 0; color: var(--text-faint);
  cursor: pointer; font-size: 15px; line-height: 1; padding: 0; }
.team-chip button:hover { color: var(--bad); }

.inline-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.inline-form .field { margin: 0; flex: 1 1 130px; }
.grow { flex: 1 1 auto; }

/* ---------- standings table ---------- */
.table-wrap { overflow-x: auto; border-radius: var(--radius-sm); }
table.standings { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 430px; }
.standings th, .standings td { padding: 10px 10px; text-align: center; }
.standings th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px;
  color: var(--text-faint); font-weight: 700; border-bottom: 1px solid rgba(255,255,255,.14); }
.standings td { border-bottom: 1px solid rgba(255,255,255,.07); font-variant-numeric: tabular-nums; }
.standings td.team { text-align: left; font-weight: 600; }
.standings tr:first-child td .rank { color: var(--gold); }
.rank { display: inline-block; width: 20px; color: var(--text-faint); font-weight: 700; }
.standings td.w { color: var(--good); font-weight: 700; }
.standings td.pts { font-weight: 800; }

/* ---------- leaderboard ---------- */
.lb-row { display: flex; align-items: center; gap: 12px; padding: 11px 4px;
  border-bottom: 1px solid rgba(255,255,255,.08); }
.lb-row:last-child { border-bottom: 0; }
.lb-rank { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 800; background: rgba(255,255,255,.09);
  border: 1px solid rgba(255,255,255,.16); color: var(--text-dim); flex: none; }
.lb-row.first .lb-rank { color: #0b1026; background: linear-gradient(150deg, #ffd479, #ffb35c); border: 0; }
.lb-name { flex: 1; font-weight: 700; font-size: 14.5px; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-count { font-size: 13px; color: var(--text-dim); white-space: nowrap; }
.lb-bar { height: 6px; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

.champion-banner { text-align: center; padding: 14px 10px 10px; }
.champion-banner .cup { font-size: 38px; }
.champion-banner .who { font-size: 21px; font-weight: 800; margin-top: 4px; color: var(--gold); }
.champion-banner .txt { color: var(--text-dim); font-size: 12.5px; margin-top: 3px; }

/* ---------- misc ---------- */
.empty { text-align: center; color: var(--text-dim); padding: 24px 14px; font-size: 14px; }
.empty .big { font-size: 32px; display: block; margin-bottom: 10px; opacity: .8; }
.divider { height: 1px; background: rgba(255,255,255,.12); margin: 16px 0; border: 0; }
.spacer { height: 8px; }
.hint { font-size: 12px; color: var(--text-faint); margin-top: 8px; line-height: 1.5; }
.back-link { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  color: var(--text-dim); font-size: 14px; margin-bottom: 12px; background: none; border: 0; font-family: inherit; padding: 4px 0; }
.back-link:hover { color: var(--text); }
.hero { text-align: center; padding: 26px 20px 22px; }
.hero .trophy { font-size: 44px; }
.hero h2 { font-size: 22px; margin: 10px 0 4px; }
.hero .sub { margin: 0; }
  </style>
</head>
<body>
  <!-- animated liquid-glass backdrop -->
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span>
    <span class="blob b3"></span><span class="blob b4"></span>
  </div>

  <header class="app-header glass">
    <div class="brand">
      <div class="brand-mark">🏆</div>
      <div class="brand-text">
        <h1 id="headerTitle">RallyGlass</h1>
        <p>Tournament scores</p>
      </div>
    </div>
  </header>

  <main class="app-main">
    <section id="tab-overview" class="tab-panel is-active"></section>
    <section id="tab-categories" class="tab-panel"></section>
    <section id="tab-results" class="tab-panel"></section>
  </main>

  <nav class="bottom-nav" role="tablist">
    <button class="bnav is-active" data-tab="overview" role="tab"><span class="ico">🏆</span>Overview</button>
    <button class="bnav" data-tab="categories" role="tab"><span class="ico">🗂️</span>Categories</button>
    <button class="bnav" data-tab="results" role="tab"><span class="ico">📜</span>Results</button>
  </nav>

  <script>
/* ============================================================
   RallyGlass — single-tournament scores (tournament edition)
   One tournament, many categories. Record end scores per
   category; most category wins takes the title.
   Vanilla JS, persisted to localStorage. No build step.
   ============================================================ */
(function () {
  "use strict";

  const SPORTS = {
    tennis:     { name: "Tennis",     icon: "🎾" },
    padel:      { name: "Padel",      icon: "🟡" },
    pickleball: { name: "Pickleball", icon: "🥒" },
    badminton:  { name: "Badminton",  icon: "🏸" },
    squash:     { name: "Squash",     icon: "🟠" },
  };

  /* ---------------- storage (+ migration from v1/v2) ---------------- */
  const KEY = "rallyglass_v3";
  const defaultStore = () => ({ name: "", categories: [], created: Date.now() });

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  const esc = (s) =>
    String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const buzz = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

  function normalizeCategory(c) {
    return {
      id: c.id || uid(),
      name: c.name || "Category",
      sport: SPORTS[c.sport] ? c.sport : "tennis",
      teams: Array.isArray(c.teams) ? c.teams : [],
      matches: Array.isArray(c.matches) ? c.matches : [],
      done: !!c.done,
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return Object.assign(defaultStore(), JSON.parse(raw));

      // v2 (multi-tournament with categories): adopt the first tournament
      const v2 = localStorage.getItem("rallyglass_v2");
      if (v2) {
        const old = JSON.parse(v2);
        const t = (old.tournaments || [])[0];
        if (t) {
          const s = defaultStore();
          s.name = t.name || "";
          s.categories = (t.categories || []).map(normalizeCategory);
          localStorage.setItem(KEY, JSON.stringify(s));
          return s;
        }
      }
      // v1 (flat teams/matches per tournament): adopt the first as one category
      const v1 = localStorage.getItem("rallyglass_v1");
      if (v1) {
        const old = JSON.parse(v1);
        const t = (old.tournaments || [])[0];
        if (t) {
          const s = defaultStore();
          s.name = t.name || "";
          s.categories = [normalizeCategory({ name: "Open", sport: t.sport, teams: t.teams, matches: t.matches })];
          localStorage.setItem(KEY, JSON.stringify(s));
          return s;
        }
      }
    } catch (e) {}
    return defaultStore();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }

  let store = load();
  const ui = { tab: "overview", categoryId: null, renaming: false };

  /* ============================================================
     TOURNAMENT MATH
     ============================================================ */
  function computeStandings(cat) {
    const table = {};
    cat.teams.forEach((name) => { table[name] = { name, P: 0, W: 0, L: 0, PF: 0, PA: 0 }; });
    cat.matches.forEach((mt) => {
      const A = table[mt.teamA], B = table[mt.teamB];
      if (!A || !B) return;
      A.P++; B.P++;
      A.PF += mt.scoreA; A.PA += mt.scoreB;
      B.PF += mt.scoreB; B.PA += mt.scoreA;
      if (mt.scoreA > mt.scoreB) { A.W++; B.L++; } else { B.W++; A.L++; }
    });
    return Object.values(table).sort((a, b) =>
      b.W - a.W || (b.PF - b.PA) - (a.PF - a.PA) || b.PF - a.PF || a.name.localeCompare(b.name));
  }

  function categoryLeader(cat) {
    if (!cat.matches.length) return null;
    const s = computeStandings(cat);
    return s.length ? s[0].name : null;
  }

  // team → number of finished categories won, sorted
  function categoryWins() {
    const wins = {};
    store.categories.forEach((c) => {
      if (!c.done) return;
      const w = categoryLeader(c);
      if (w) wins[w] = (wins[w] || 0) + 1;
    });
    return Object.entries(wins)
      .map(([name, n]) => ({ name, n }))
      .sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
  }

  function findCategory(id) { return store.categories.find((c) => c.id === id); }

  function championBannerHtml() {
    const total = store.categories.length;
    const allDone = total > 0 && store.categories.every((c) => c.done);
    const wins = categoryWins();
    if (!allDone || !wins.length) return "";
    const maxWins = wins[0].n;
    const champs = wins.filter((w) => w.n === maxWins);
    return '<div class="champion-banner"><div class="cup">👑</div>' +
      '<div class="who">' + champs.map((c) => esc(c.name)).join(" & ") + "</div>" +
      '<div class="txt">' + (champs.length > 1 ? "share the title" : "wins the tournament") +
      " · " + maxWins + " of " + total + " categories</div></div>";
  }

  function updateHeader() {
    document.getElementById("headerTitle").textContent = store.name || "RallyGlass";
  }

  /* ============================================================
     OVERVIEW TAB
     ============================================================ */
  const overviewEl = document.getElementById("tab-overview");

  function renderOverview() {
    updateHeader();

    // first run: name the tournament
    if (!store.name) {
      overviewEl.innerHTML =
        '<div class="card glass hero">' +
        '<div class="trophy">🏆</div>' +
        "<h2>Set up your tournament</h2>" +
        '<p class="sub">One tournament, many categories. Record the end score of every match — whoever wins the most categories takes the title.</p>' +
        '<div class="spacer"></div><div class="spacer"></div>' +
        '<div class="field" style="text-align:left;"><label>Tournament name</label>' +
        '<input type="text" id="tourName" placeholder="e.g. Summer Club Championship" maxlength="60" /></div>' +
        '<button class="btn primary block" id="setName">Create tournament</button>' +
        "</div>";
      return;
    }

    const total = store.categories.length;
    const done = store.categories.filter((c) => c.done).length;
    const teams = new Set();
    let matchCount = 0;
    store.categories.forEach((c) => { c.teams.forEach((t) => teams.add(t)); matchCount += c.matches.length; });

    const wins = categoryWins();
    const maxWins = wins.length ? wins[0].n : 0;
    const lbRows = wins.length
      ? wins.map((w, i) =>
          '<div class="lb-row' + (i === 0 ? " first" : "") + '">' +
          '<div class="lb-rank">' + (i + 1) + "</div>" +
          '<div class="lb-name">' + esc(w.name) + "</div>" +
          '<div class="lb-bar" style="width:' + Math.round((w.n / Math.max(maxWins, 1)) * 70) + 'px;"></div>' +
          '<div class="lb-count">' + w.n + " " + (w.n === 1 ? "category" : "categories") + "</div></div>").join("")
      : '<div class="empty">Finish a category to put its winner on the board.</div>';

    const nameBlock = ui.renaming
      ? '<div class="inline-form"><div class="field grow"><label>Tournament name</label>' +
        '<input type="text" id="tourName" value="' + esc(store.name) + '" maxlength="60" /></div>' +
        '<button class="btn primary" id="setName">Save</button></div>'
      : '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">' +
        "<div><h2>🏆 " + esc(store.name) + "</h2>" +
        '<p class="sub" style="margin-bottom:0;">Most category wins takes the title</p></div>' +
        '<button class="btn ghost small" id="renameTour">Rename</button></div>';

    overviewEl.innerHTML =
      '<div class="card glass">' + nameBlock +
      '<div class="spacer"></div><div class="spacer"></div>' +
      '<div class="pills">' +
      '<span class="pill">🗂️ ' + total + (total === 1 ? " category" : " categories") + "</span>" +
      '<span class="pill">✅ ' + done + " finished</span>" +
      '<span class="pill">👥 ' + teams.size + (teams.size === 1 ? " team" : " teams") + "</span>" +
      '<span class="pill">🎾 ' + matchCount + (matchCount === 1 ? " match" : " matches") + "</span>" +
      "</div>" +
      championBannerHtml() +
      '<hr class="divider" />' +
      '<p class="section-title">Leaderboard — category wins</p>' + lbRows +
      "</div>" +
      '<div class="card glass"><p class="section-title">Danger zone</p>' +
      '<button class="btn danger block" id="resetTournament">Start a new tournament (erase everything)</button></div>';
  }

  overviewEl.addEventListener("click", (e) => {
    if (e.target.closest("#setName")) {
      const name = (document.getElementById("tourName").value || "").trim();
      if (!name) { alert("Please enter a tournament name."); return; }
      store.name = name;
      ui.renaming = false;
      save();
      renderAll();
      return;
    }
    if (e.target.closest("#renameTour")) { ui.renaming = true; renderOverview(); return; }
    if (e.target.closest("#resetTournament")) {
      if (confirm("Erase this tournament — all categories, teams and results?") &&
          confirm("Really erase everything? This cannot be undone.")) {
        store = defaultStore();
        ui.categoryId = null;
        save();
        renderAll();
      }
    }
  });
  overviewEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.id === "tourName") {
      e.preventDefault();
      const btn = document.getElementById("setName");
      if (btn) btn.click();
    }
  });

  /* ============================================================
     CATEGORIES TAB — list → category detail
     ============================================================ */
  const catEl = document.getElementById("tab-categories");

  function renderCategories() {
    const c = ui.categoryId && findCategory(ui.categoryId);
    if (c) return renderCategoryDetail(c);
    ui.categoryId = null;
    renderCategoryList();
  }

  function renderCategoryList() {
    const sportOptions = Object.entries(SPORTS)
      .map(([k, s]) => '<option value="' + k + '">' + s.icon + " " + s.name + "</option>").join("");

    const rows = store.categories.length
      ? store.categories.map((c) => {
          const icon = SPORTS[c.sport].icon;
          const leader = categoryLeader(c);
          const status = c.done
            ? '<span class="pill win">🏅 ' + esc(leader || "—") + "</span>"
            : leader
              ? '<span class="pill">Leading: ' + esc(leader) + "</span>"
              : '<span class="pill">Not started</span>';
          return '<div class="row-item clickable" data-open-cat="' + c.id + '">' +
            '<div class="main"><div class="ttl">' + icon + " " + esc(c.name) + "</div>" +
            '<div class="meta">' + c.teams.length + " teams · " + c.matches.length + " matches" +
            (c.done ? " · finished" : "") + "</div></div>" + status + "</div>";
        }).join("")
      : '<div class="empty"><span class="big">🗂️</span>No categories yet.<br/>Add the first one above — e.g. Men’s Singles, Mixed Doubles.</div>';

    catEl.innerHTML =
      '<div class="card glass"><h2>Add a category</h2>' +
      '<p class="sub">Each category has its own teams, results and standings.</p>' +
      '<div class="inline-form"><div class="field grow"><label>Category name</label>' +
      '<input type="text" id="catName" placeholder="e.g. Men’s Singles" maxlength="50" /></div>' +
      '<div class="field"><label>Sport</label><select id="catSport">' + sportOptions + "</select></div>" +
      '<button class="btn primary" id="addCategory">Add</button></div></div>' +
      '<div class="card glass"><p class="section-title">Categories</p><div class="spacer"></div>' +
      '<div class="list">' + rows + "</div></div>";
  }

  function renderCategoryDetail(c) {
    const sport = SPORTS[c.sport];

    const teamChips = c.teams.length
      ? c.teams.map((name) =>
          '<span class="team-chip">' + esc(name) +
          '<button data-remove-team="' + esc(name) + '" title="Remove">×</button></span>').join("")
      : '<span class="hint">No teams yet — add your first team above.</span>';

    const teamSelect = c.teams.map((n) => '<option value="' + esc(n) + '">' + esc(n) + "</option>").join("");
    const canRecord = c.teams.length >= 2 && !c.done;

    const matchList = c.matches.length
      ? c.matches.slice().reverse().map((mt) => {
          const aWon = mt.scoreA > mt.scoreB;
          return '<div class="row-item"><div class="main"><div class="ttl">' +
            '<span style="color:' + (aWon ? "var(--good)" : "inherit") + '">' + esc(mt.teamA) + "</span>" +
            '<span style="color:var(--text-faint)"> ' + mt.scoreA + " – " + mt.scoreB + " </span>" +
            '<span style="color:' + (!aWon ? "var(--good)" : "inherit") + '">' + esc(mt.teamB) + "</span></div>" +
            '<div class="meta">' + new Date(mt.date).toLocaleDateString() + "</div></div>" +
            (c.done ? "" : '<button class="btn ghost small" data-del-match="' + mt.id + '">Delete</button>') +
            "</div>";
        }).join("")
      : '<div class="empty">No matches recorded yet.</div>';

    const standings = computeStandings(c);
    const standingsRows = standings.map((s, i) =>
      "<tr><td class=\"team\"><span class=\"rank\">" + (i + 1) + "</span>" + esc(s.name) + "</td>" +
      "<td>" + s.P + '</td><td class="w">' + s.W + "</td><td>" + s.L + "</td>" +
      "<td>" + s.PF + "</td><td>" + s.PA + "</td>" +
      "<td>" + (s.PF - s.PA > 0 ? "+" : "") + (s.PF - s.PA) + "</td>" +
      '<td class="pts">' + s.W * 2 + "</td></tr>").join("");

    const winner = categoryLeader(c);
    const doneBanner = c.done
      ? '<div class="champion-banner"><div class="cup">🏅</div>' +
        '<div class="who">' + esc(winner || "—") + "</div>" +
        '<div class="txt">wins ' + esc(c.name) + "</div></div>"
      : "";

    catEl.innerHTML =
      '<button class="back-link" id="backToCats">← All categories</button>' +
      '<div class="card glass">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">' +
      "<div><h2>" + sport.icon + " " + esc(c.name) + "</h2>" +
      '<p class="sub">' + sport.name + " · " + c.teams.length + " teams · " + c.matches.length + " matches</p></div>" +
      '<div style="display:flex;gap:8px;">' +
      '<button class="btn small ' + (c.done ? "ghost" : "primary") + '" id="toggleDone"' +
      (!c.done && !c.matches.length ? " disabled" : "") + ">" +
      (c.done ? "Reopen" : "Finish category") + "</button>" +
      '<button class="btn danger small" id="deleteCategory">Delete</button></div></div>' +
      doneBanner +
      (c.done ? "" :
        '<p class="section-title">Teams</p>' +
        '<div class="inline-form"><div class="field grow"><label>Add a team</label>' +
        '<input type="text" id="teamName" placeholder="Team or player name" maxlength="40" /></div>' +
        '<button class="btn" id="addTeam">Add team</button></div>' +
        '<div class="spacer"></div><div class="chips">' + teamChips + "</div>") +
      "</div>" +
      '<div class="card glass"><p class="section-title">Record a result</p>' +
      (canRecord
        ? '<div class="inline-form">' +
          '<div class="field"><label>Team 1</label><select id="mTeamA">' + teamSelect + "</select></div>" +
          '<div class="field" style="flex:0 0 80px;"><label>Score</label><input type="number" id="mScoreA" min="0" step="1" placeholder="0" /></div>' +
          '<div class="field" style="flex:0 0 80px;"><label>Score</label><input type="number" id="mScoreB" min="0" step="1" placeholder="0" /></div>' +
          '<div class="field"><label>Team 2</label><select id="mTeamB">' + teamSelect + "</select></div></div>" +
          '<div class="spacer"></div><button class="btn primary" id="recordMatch">Add result</button>' +
          '<p class="hint">Enter the final score (sets, games or points won). The higher score wins.</p>'
        : c.done
          ? '<div class="empty">Category finished — reopen it to record more results.</div>'
          : '<div class="empty">Add at least two teams to start recording results.</div>') +
      "</div>" +
      '<div class="card glass"><p class="section-title">Standings</p><div class="spacer"></div>' +
      (standings.length
        ? '<div class="table-wrap"><table class="standings"><thead><tr>' +
          '<th style="text-align:left;">Team</th><th>P</th><th>W</th><th>L</th><th>PF</th><th>PA</th><th>Diff</th><th>Pts</th>' +
          "</tr></thead><tbody>" + standingsRows + "</tbody></table></div>" +
          '<p class="hint">P played · W won · L lost · PF/PA points for & against · Pts = 2 per win.</p>' +
          '<p class="hint">Rank order: wins, then point difference, then points for.</p>'
        : '<div class="empty">Standings appear once teams are added.</div>') +
      "</div>" +
      '<div class="card glass"><p class="section-title">Matches in this category</p><div class="spacer"></div>' +
      '<div class="list">' + matchList + "</div></div>";
  }

  /* ---- category actions ---- */
  function addCategory() {
    const name = (document.getElementById("catName").value || "").trim();
    const sport = document.getElementById("catSport").value;
    if (!name) { alert("Please enter a category name."); return; }
    if (!store.name) store.name = "My Tournament";
    const c = { id: uid(), name, sport, teams: [], matches: [], done: false };
    store.categories.push(c);
    ui.categoryId = c.id;
    save();
    renderAll();
  }

  function addTeam(c) {
    const input = document.getElementById("teamName");
    const name = (input.value || "").trim();
    if (!name) return;
    if (c.teams.some((n) => n.toLowerCase() === name.toLowerCase())) {
      alert("That team is already in this category."); return;
    }
    c.teams.push(name);
    save();
    renderCategories();
  }

  function recordMatch(c) {
    const teamA = document.getElementById("mTeamA").value;
    const teamB = document.getElementById("mTeamB").value;
    const scoreA = parseInt(document.getElementById("mScoreA").value, 10);
    const scoreB = parseInt(document.getElementById("mScoreB").value, 10);
    if (teamA === teamB) { alert("Pick two different teams."); return; }
    if (isNaN(scoreA) || isNaN(scoreB)) { alert("Enter a score for both teams."); return; }
    if (scoreA === scoreB) { alert("A match can't end in a tie — enter a winning score."); return; }
    c.matches.push({ id: uid(), teamA, teamB, scoreA, scoreB, date: Date.now() });
    buzz(12);
    save();
    renderAll();
  }

  catEl.addEventListener("click", (e) => {
    if (e.target.closest("#addCategory")) return addCategory();

    const openCat = e.target.closest("[data-open-cat]");
    if (openCat) { ui.categoryId = openCat.dataset.openCat; renderCategories(); return; }
    if (e.target.closest("#backToCats")) { ui.categoryId = null; renderCategories(); return; }

    const c = ui.categoryId && findCategory(ui.categoryId);
    if (!c) return;

    if (e.target.closest("#addTeam")) return addTeam(c);
    if (e.target.closest("#recordMatch")) return recordMatch(c);
    if (e.target.closest("#toggleDone")) { c.done = !c.done; save(); renderAll(); return; }
    if (e.target.closest("#deleteCategory")) {
      if (confirm('Delete category "' + c.name + '" and its results?')) {
        store.categories = store.categories.filter((x) => x.id !== c.id);
        ui.categoryId = null; save(); renderAll();
      }
      return;
    }
    const rmTeam = e.target.closest("[data-remove-team]");
    if (rmTeam) {
      c.teams = c.teams.filter((n) => n !== rmTeam.dataset.removeTeam);
      save(); renderAll(); return;
    }
    const delMatch = e.target.closest("[data-del-match]");
    if (delMatch) {
      c.matches = c.matches.filter((m) => m.id !== delMatch.dataset.delMatch);
      save(); renderAll(); return;
    }
  });

  catEl.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    if (e.target.id === "catName") { e.preventDefault(); addCategory(); }
    else if (e.target.id === "teamName") {
      const c = ui.categoryId && findCategory(ui.categoryId);
      if (c) { e.preventDefault(); addTeam(c); }
    }
  });

  /* ============================================================
     RESULTS TAB — every match across all categories
     ============================================================ */
  const resEl = document.getElementById("tab-results");

  function renderResults() {
    const all = [];
    store.categories.forEach((c) => {
      c.matches.forEach((mt) => all.push({ cat: c, mt }));
    });
    all.sort((a, b) => b.mt.date - a.mt.date);

    const rows = all.length
      ? all.map(({ cat, mt }) => {
          const aWon = mt.scoreA > mt.scoreB;
          return '<div class="row-item"><div class="main"><div class="ttl">' +
            '<span style="color:' + (aWon ? "var(--good)" : "inherit") + '">' + esc(mt.teamA) + "</span>" +
            '<span style="color:var(--text-faint)"> ' + mt.scoreA + " – " + mt.scoreB + " </span>" +
            '<span style="color:' + (!aWon ? "var(--good)" : "inherit") + '">' + esc(mt.teamB) + "</span></div>" +
            '<div class="meta">' + SPORTS[cat.sport].icon + " " + esc(cat.name) +
            " · " + new Date(mt.date).toLocaleDateString() + "</div></div></div>";
        }).join("")
      : '<div class="empty"><span class="big">📜</span>No results yet.<br/>Record match scores inside a category.</div>';

    resEl.innerHTML =
      '<div class="card glass"><h2>All results</h2>' +
      '<p class="sub">Every recorded match, across all categories, newest first.</p>' +
      '<div class="list">' + rows + "</div></div>";
  }

  /* ============================================================
     NAV + BOOT
     ============================================================ */
  function renderAll() {
    renderOverview();
    renderCategories();
    renderResults();
  }

  document.querySelectorAll(".bnav").forEach((btn) => {
    btn.addEventListener("click", () => {
      ui.tab = btn.dataset.tab;
      buzz(8);
      document.querySelectorAll(".bnav").forEach((b) => b.classList.toggle("is-active", b === btn));
      document.querySelectorAll(".tab-panel").forEach((p) =>
        p.classList.toggle("is-active", p.id === "tab-" + ui.tab));
      if (ui.tab === "overview") renderOverview();
      else if (ui.tab === "categories") renderCategories();
      else renderResults();
    });
  });

  renderAll();
})();
  </script>
</body>
</html>
