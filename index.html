      (ed.mode === "final" ? finalPanel : pointsPanel) +
      '<hr class="divider" />' +
      '<button class="btn primary block" id="recordResult">Record result 🏅 (+1 point)</button>' +
      "</div>";
  }

  /* ---- live scoring core (shared by the detail view and the courtside board) ---- */
  function liveTap(c, side) {
    const ed = editState(c);
    const before = computeLive(c, ed);
    if (before.over) return;
    ed.live.log.push(side);
    const st = computeLive(c, ed);
    const scored = st.a + st.b > before.a + before.b;
    buzz(12);
    if (scored) pointSound(side); else beep(330, 0.07);   // side-out / serve handover blip
    const spokenCall = st.call.split("–").join(", ");
    if (st.over) {
      fanfare();
      announce("Game, " + edSideLabel(ed, st.a > st.b ? 0 : 1) + ", " + st.a + ", " + st.b);
      if (prefs.autosave) {
        const line = st.a + "–" + st.b;
        if (saveLiveGame(c, ed)) toast("Game saved " + line + " ✔");
      }
    } else if (st.golden) {
      announce("Golden point!");
    } else if (st.gamePoint) {
      announce("Game point, " + spokenCall);
    } else if (!scored) {
      announce(st.sideout && st.doubles && st.serverNum === 2 ? "Second server" : "Side out, " + spokenCall);
    } else {
      announce(spokenCall);
    }
    renderContestDetail(c);
    if (ui.board) renderBoard(c);
  }

  function liveUndo(c) {
    const ed = editState(c);
    ed.live.log.pop();
    renderContestDetail(c);
    if (ui.board) renderBoard(c);
  }

  /* ---- courtside scoreboard (fullscreen big-numbers display) ---- */
  const boardEl = document.createElement("div");
  boardEl.className = "board";
  document.body.appendChild(boardEl);

  function renderBoard(c) {
    const ed = editState(c);
    const lv = ed.live;
    const st = computeLive(c, ed);
    const gameOver = st.over;
    const savedGames = ed.games.filter((g) => g.a !== "" && g.b !== "");

    const half = (side) => {
      const serving = !gameOver && st.serving === side;
      return '<button class="board-half ' + HOUSES[side].key + '" data-btap="' + side + '">' +
        '<div class="b-score">' + (side === 0 ? st.a : st.b) + "</div>" +
        '<div class="b-name">' + esc(edSideLabel(ed, side)) + "</div>" +
        (serving
          ? '<div class="b-srv">● SERVING' + (st.sideout && st.doubles ? " · #" + st.serverNum : "") + "</div>"
          : '<div class="b-hint">' + (st.sideout ? "tap = won rally" : "tap to score") + "</div>") +
        "</button>";
    };

    const mid = gameOver
      ? '<span class="badge gp">Game ' + st.a + "–" + st.b + "</span>"
      : st.golden
        ? '<span class="badge gp">GOLDEN POINT 😈</span>'
        : st.gamePoint
          ? '<span class="badge gp">Game point</span>'
          : '<span class="badge" style="background:rgba(255,255,255,.12);color:rgba(233,238,255,.75);">' +
            (st.sideout && lv.log.length ? "Call: " + st.call : "Rally to " + lv.target) +
            (savedGames.length ? " · games " + savedGames.map((g) => g.a + "–" + g.b).join(", ") : "") + "</span>";

    boardEl.innerHTML =
      '<div class="board-ctl">' +
      '<button class="btn small" id="boardUndo"' + (lv.log.length ? "" : " disabled") + ">↩︎ Undo</button>" +
      '<button class="btn small" id="boardClose">✕ Exit</button></div>' +
      half(0) + half(1) +
      '<div class="board-mid">' + mid + "</div>";
  }

  function openBoard(c) {
    ui.board = true;
    renderBoard(c);
    boardEl.classList.add("open");
    acquireWake();
    try {
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  }

  function closeBoard() {
    ui.board = false;
    boardEl.classList.remove("open");
    try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) {}
  }

  boardEl.addEventListener("click", (e) => {
    const c = ui.contestId && findContest(ui.contestId);
    if (!c) return closeBoard();
    if (e.target.closest("#boardClose")) return closeBoard();
    if (e.target.closest("#boardUndo")) return liveUndo(c);
    const half = e.target.closest("[data-btap]");
    if (half) liveTap(c, parseInt(half.dataset.btap, 10));
  });

  /* ---- contest actions ---- */
  // store a finished point-by-point game into the game-score rows
  function saveLiveGame(c, ed) {
    const lv = ed.live;
    const st = computeLive(c, ed);
    const slot = ed.games.find((g) => g.a === "" && g.b === "");
    if (slot) { slot.a = String(st.a); slot.b = String(st.b); }
    else if (ed.games.length < 3) ed.games.push({ a: String(st.a), b: String(st.b) });
    else { alert("All three game slots are full — clear one first."); return false; }
    // game winner serves first in the next game
    ed.live = { target: lv.target, rule: lv.rule, firstServer: st.a > st.b ? 0 : 1, startPos: lv.startPos, log: [] };
    return true;
  }

  function commitResult(c) {
    const ed = editState(c);

    if (c.kind === "special") {
      if (ed.specialWinner == null) { alert("Pick the winning house first."); return; }
      c.winner = ed.specialWinner;
      c.games = [];
      c.playersA = []; c.playersB = [];
    } else {
      const lv = ed.live;
      if (computeLive(c, ed).over) {
        if (!saveLiveGame(c, ed)) return;       // finished live game joins the score rows
      } else if (lv.log.length &&
          !confirm("A point-by-point game is still in progress and will be discarded. Record anyway?")) {
        return;
      }
      const games = [];
      for (const g of ed.games) {
        const a = parseInt(g.a, 10), b = parseInt(g.b, 10);
        if (isNaN(a) && isNaN(b)) continue;           // untouched row
        if (isNaN(a) || isNaN(b)) { alert("Fill in both sides of every game score."); return; }
        if (a === b) { alert("A game can't end tied — golden point decides it!"); return; }
        games.push({ a, b });
      }
      if (!games.length) { alert("Enter at least one game score."); return; }
      let wa = 0, wb = 0;
      games.forEach((g) => { if (g.a > g.b) wa++; else wb++; });
      if (wa === wb) { alert("Games are level — add a deciding game."); return; }
      c.games = games;
      c.winner = wa > wb ? 0 : 1;
      c.playersA = ed.playersA.filter(Boolean);
      c.playersB = ed.playersB.filter(Boolean);
    }

    c.points = 1;
    c.done = true;
    ui.edit = null;
    buzz(20);
    fanfare();
    save();
    renderAll();
    toast("🏅 " + esc(HOUSES[c.winner].name) + " take " + esc(c.name), "Undo", () => {
      c.done = false;
      ui.edit = null;
      save();
      renderAll();
    });
  }

  conEl.addEventListener("click", (e) => {
    if (e.target.closest("#showAddContest")) {
      ui.addingContest = true;
      renderContestList();
      document.getElementById("newContestName").focus();
      return;
    }
    const openBtn = e.target.closest("[data-open]");
    if (openBtn) { ui.contestId = openBtn.dataset.open; ui.edit = null; renderContests(); return; }
    if (e.target.closest("#backToRoll")) { ui.contestId = null; ui.edit = null; releaseWake(); closeBoard(); renderContests(); return; }

    if (e.target.closest("#addContest")) {
      const name = (document.getElementById("newContestName").value || "").trim();
      if (!name) { alert("Name the new contest first."); return; }
      store.contests.push({
        id: uid(), name, kind: "doubles", icon: "🆕",
        desc: "Decreed by the council mid-tournament. Rules may change. 😎",
        points: 10, playersA: [], playersB: [], games: [], winner: null, done: false,
      });
      save();
      renderContests();
      return;
    }

    const c = ui.contestId && findContest(ui.contestId);
    if (!c) return;

    if (e.target.closest("#recordResult")) return commitResult(c);
    if (e.target.closest("#reopenContest")) { c.done = false; ui.edit = null; save(); renderAll(); return; }
    if (e.target.closest("#deleteContest")) {
      if (confirm('Remove "' + c.name + '" from the roll?')) {
        store.contests = store.contests.filter((x) => x.id !== c.id);
        ui.contestId = null; ui.edit = null;
        save(); renderAll();
      }
      return;
    }
    if (e.target.closest("#addGame")) {
      const ed = editState(c);
      if (ed.games.length < 3) ed.games.push({ a: "", b: "" });
      renderContestDetail(c);
      return;
    }

    // --- point-by-point scorer ---
    const modeBtn = e.target.closest("[data-mode]");
    if (modeBtn) {
      const ed = editState(c);
      ed.mode = modeBtn.dataset.mode;
      ed.step = "score";
      if (modeBtn.dataset.mode === "points") acquireWake(); else releaseWake();
      renderContestDetail(c);
      return;
    }
    if (e.target.closest("#backToSetup")) {
      editState(c).step = "setup";
      releaseWake();
      renderContestDetail(c);
      return;
    }
    const swapBtn = e.target.closest("[data-swap]");
    if (swapBtn) {
      const ed = editState(c);
      const side = parseInt(swapBtn.dataset.swap, 10);
      const sp = ed.live.startPos || [[0, 1], [0, 1]];
      sp[side] = [sp[side][1], sp[side][0]];
      ed.live.startPos = sp;
      renderContestDetail(c);
      return;
    }

    const targetBtn = e.target.closest("[data-lt]");
    if (targetBtn) {
      const ed = editState(c);
      ed.live = { target: parseInt(targetBtn.dataset.lt, 10), rule: ed.live.rule, firstServer: ed.live.firstServer, startPos: ed.live.startPos, log: [] };
      renderContestDetail(c);
      return;
    }
    const ruleBtn = e.target.closest("[data-lr]");
    if (ruleBtn) {
      const ed = editState(c);
      ed.live = { target: ed.live.target, rule: ruleBtn.dataset.lr, firstServer: ed.live.firstServer, startPos: ed.live.startPos, log: [] };
      renderContestDetail(c);
      return;
    }
    const fsvBtn = e.target.closest("[data-fsv]");
    if (fsvBtn) {
      const ed = editState(c);
      ed.live = { target: ed.live.target, rule: ed.live.rule, firstServer: parseInt(fsvBtn.dataset.fsv, 10), startPos: ed.live.startPos, log: [] };
      renderContestDetail(c);
      return;
    }
    const tapBtn = e.target.closest("[data-tap]");
    if (tapBtn) { liveTap(c, parseInt(tapBtn.dataset.tap, 10)); return; }
    if (e.target.closest("#liveUndo")) { liveUndo(c); return; }
    if (e.target.closest("#openBoard")) { openBoard(c); return; }
    if (e.target.closest("#liveReset")) {
      const ed = editState(c);
      ed.live = { target: ed.live.target, rule: ed.live.rule, firstServer: ed.live.firstServer, startPos: ed.live.startPos, log: [] };
      renderContestDetail(c);
      return;
    }
    if (e.target.closest("#saveGame")) {
      const ed = editState(c);
      if (saveLiveGame(c, ed)) { buzz(20); renderContestDetail(c); }
      return;
    }

    const sw = e.target.closest("[data-special-win]");
    if (sw) {
      const ed = editState(c);
      ed.specialWinner = parseInt(sw.dataset.specialWin, 10);
      renderContestDetail(c);
      return;
    }
    if (e.target.closest("#extrasToggle")) {
      editState(c).showExtras = true;
      renderContestDetail(c);
      return;
    }
    if (e.target.closest("#photoBtn")) {
      const inp = document.getElementById("photoInput");
      if (inp) inp.click();
      return;
    }
    if (e.target.closest("#photoRemove")) {
      c.photo = null;
      save();
      renderContestDetail(c);
      return;
    }
  });

  // photo attach: downscale to keep localStorage happy
  conEl.addEventListener("change", (e) => {
    if (e.target.id !== "photoInput") return;
    const c = ui.contestId && findContest(ui.contestId);
    const file = e.target.files && e.target.files[0];
    if (!c || !file) return;
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 900 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * scale);
      cv.height = Math.round(img.height * scale);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      let data = cv.toDataURL("image/jpeg", 0.72);
      if (data.length > 350000) data = cv.toDataURL("image/jpeg", 0.5);
      URL.revokeObjectURL(img.src);
      const prev = c.photo;
      c.photo = data;
      try {
        localStorage.setItem(KEY, JSON.stringify(store));
        renderContestDetail(c);
      } catch (err) {
        c.photo = prev;
        alert("Not enough browser storage for this photo — try removing another photo first.");
      }
    };
    img.src = URL.createObjectURL(file);
    e.target.value = "";
  });

  // keep typed values in the transient edit state across re-renders
  conEl.addEventListener("input", (e) => {
    const c = ui.contestId && findContest(ui.contestId);
    if (!c) return;
    const ed = editState(c);
    if (e.target.dataset.game) {
      const [i, side] = e.target.dataset.game.split("-");
      ed.games[+i][side] = e.target.value;
    } else if (e.target.id === "schedTime") {
      c.time = e.target.value.trim(); save();
    } else if (e.target.id === "contestNote") {
      c.note = e.target.value.trim(); save();
    }
  });
  conEl.addEventListener("change", (e) => {
    const c = ui.contestId && findContest(ui.contestId);
    if (!c) return;
    if (e.target.id === "schedCourt") { c.court = e.target.value; save(); return; }
    const ed = editState(c);
    if (e.target.dataset.player) {
      const [side, slot] = e.target.dataset.player.split("-").map(Number);
      (side === 0 ? ed.playersA : ed.playersB)[slot] = e.target.value;
      const name = e.target.value;
      if (name && fieldedCount(name) >= 2) {
        toast("⚠️ " + esc(name) + " has already played 2 contests — the decree allows max 2. NO CHITCHING!");
      }
    }
  });
  conEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.id === "newContestName") {
      e.preventDefault();
      document.getElementById("addContest").click();
    }
  });

  /* ============================================================
     HOUSES TAB — the roll call of the realm + player records
     ============================================================ */
  const housesEl = document.getElementById("tab-houses");

  // every decided contest this player was fielded in
  function playerHistory(name) {
    const out = [];
    store.contests.forEach((c) => {
      if (!c.done || c.winner == null) return;
      for (const side of [0, 1]) {
        const arr = side === 0 ? c.playersA : c.playersB;
        if (arr && arr.indexOf(name) >= 0) out.push({ c, side, won: c.winner === side });
      }
    });
    return out;
  }

  function playerHistoryCard(name, houseIdx) {
    const hist = playerHistory(name);
    const rows = hist.length
      ? hist.map((h) => {
          const { c, side, won } = h;
          const partner = (side === 0 ? c.playersA : c.playersB).filter((p) => p !== name);
          const opponents = (side === 0 ? c.playersB : c.playersA).filter(Boolean);
          const scoreline = c.games.length
            ? c.games.map((g) => (side === 0 ? g.a + "–" + g.b : g.b + "–" + g.a)).join(", ")
            : "";
          return '<div class="row-item won-' + HOUSES[c.winner].key + '">' +
            '<div class="main"><div class="ttl">' + c.icon + " " + esc(c.name) + "</div>" +
            '<div class="meta">' +
            (partner.length ? "with " + esc(partner.join(" & ")) + " · " : "") +
            (opponents.length ? "vs " + esc(opponents.join(" & ")) + " · " : "") +
            (scoreline ? scoreline : "") + "</div></div>" +
            '<span class="pill ' + (won ? HOUSES[houseIdx].key : "") + '">' + (won ? "🏅 Won" : "Lost") + "</span></div>";
        }).join("")
      : '<div class="empty">No decided contests yet for ' + esc(name) + ".</div>";

    let pf = 0, pa = 0;
    hist.forEach((h) => {
      h.c.games.forEach((g) => { pf += h.side === 0 ? g.a : g.b; pa += h.side === 0 ? g.b : g.a; });
    });
    const totals = hist.length && (pf || pa)
      ? '<p class="hint" style="margin:10px 0 0;text-align:center;">Rally points across games: <b style="color:var(--good)">' +
        pf + " won</b> · <b style=\"color:var(--bad)\">" + pa + " conceded</b></p>"
      : "";

    return '<div class="card glass">' +
      '<p class="phist-title">📜 <span class="who">' + esc(name) + "</span> — battle record</p>" +
      '<div class="list">' + rows + "</div>" + totals + "</div>";
  }

  function renderHouses() {
    const houseCard = (i) => {
      const h = HOUSES[i];
      const editing = ui.editRoster === i && !VIEW;
      const players = roster(i).map((p, n) => {
        const hist = playerHistory(p);
        const w = hist.filter((x) => x.won).length;
        const l = hist.length - w;
        const fc = fieldedCount(p);
        const rec = hist.length
          ? '<span class="rec">' + (w ? '<b class="rw">' + w + "W</b>" : "") + (l ? '<b class="rl">' + l + "L</b>" : "") +
            (fc > 2 ? " ⚠️" : "") + "</span>"
          : '<span class="rec dim">—</span>';
        const rm = editing ? '<button class="rmv" data-rm-player="' + esc(p) + '" title="Remove">×</button>' : "";
        return '<div class="player clickable" data-pl="' + esc(p) + '"><span class="num">' + (n + 1) + "</span>" +
          '<span class="pname">' + esc(p) + "</span>" + rec + rm + "</div>";
      }).join("");
      const addForm = editing
        ? '<div class="inline-form" style="margin-top:12px;"><div class="field grow">' +
          '<input type="text" data-add-player-input="' + i + '" placeholder="New player name" maxlength="30" /></div>' +
          '<button class="btn small" data-add-player="' + i + '">Add</button></div>'
        : "";
      const openHist = ui.playerOpen && roster(i).indexOf(ui.playerOpen) >= 0
        ? playerHistoryCard(ui.playerOpen, i)
        : "";
      return '<div class="card glass house-card ' + h.key + '">' +
        '<div class="hc-top"><div class="hc-crest">' + h.crest + "</div>" +
        '<div style="flex:1;min-width:0;"><h2 class="hc-name">' + esc(h.name) + '</h2><p class="hc-title">' + esc(h.title) + "</p></div>" +
        (VIEW ? "" : '<button class="btn ghost small" data-edit-roster="' + i + '">' + (editing ? "Done" : "✏️ Edit") + "</button>") +
        "</div>" +
        '<p class="hc-motto">' + esc(h.motto) + "</p>" +
        '<div class="roster">' + players + "</div>" + addForm +
        "</div>" + openHist;
    };

    housesEl.innerHTML =
      houseCard(0) + houseCard(1) +
      '<div class="card glass"><p class="decree">Max 2 contests per player, min 1. NO CHITCHING! 👑</p></div>';
  }

  function addRosterPlayer(i) {
    const input = housesEl.querySelector('[data-add-player-input="' + i + '"]');
    const name = (input.value || "").trim();
    if (!name) return;
    if (store.rosters[0].concat(store.rosters[1]).some((p) => p.toLowerCase() === name.toLowerCase())) {
      alert("That name is already on a roster."); return;
    }
    store.rosters[i].push(name);
    save();
    renderHouses();
  }

  housesEl.addEventListener("click", (e) => {
    const editBtn = e.target.closest("[data-edit-roster]");
    if (editBtn) {
      const i = parseInt(editBtn.dataset.editRoster, 10);
      ui.editRoster = ui.editRoster === i ? null : i;
      renderHouses();
      return;
    }
    const addBtn = e.target.closest("[data-add-player]");
    if (addBtn) return addRosterPlayer(parseInt(addBtn.dataset.addPlayer, 10));

    const rmBtn = e.target.closest("[data-rm-player]");
    if (rmBtn) {
      const name = rmBtn.dataset.rmPlayer;
      const played = playerHistory(name).length;
      if (!confirm("Remove " + name + " from the roster?" +
          (played ? " Their " + played + " recorded contest(s) keep their name." : ""))) return;
      store.rosters = store.rosters.map((r) => r.filter((p) => p !== name));
      if (ui.playerOpen === name) ui.playerOpen = null;
      save();
      renderHouses();
      return;
    }
    const pl = e.target.closest("[data-pl]");
    if (pl) {
      ui.playerOpen = ui.playerOpen === pl.dataset.pl ? null : pl.dataset.pl;
      renderHouses();
    }
  });
  housesEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.matches("[data-add-player-input]")) {
      e.preventDefault();
      addRosterPlayer(parseInt(e.target.dataset.addPlayerInput, 10));
    }
  });

  /* ============================================================
     SETTINGS TAB — theme, backup, danger zone
     ============================================================ */
  const settingsEl = document.getElementById("tab-settings");

  function backupJson() {
    return JSON.stringify({ app: "verandas-cup", exported: new Date().toISOString(), data: store }, null, 2);
  }

  function renderSettings() {
    const pref = themePref();
    const seg = (val, label) =>
      '<button data-theme-pref="' + val + '" class="' + (pref === val ? "is-active" : "") + '">' + label + "</button>";

    const switchRow = (key, title, sub) =>
      '<div class="switch-row" data-pref="' + key + '">' +
      '<div class="sw-text"><div class="sw-title">' + title + '</div><div class="sw-sub">' + sub + "</div></div>" +
      '<div class="switch ' + (prefs[key] ? "on" : "") + '"></div></div>';

    const appearance =
      '<div class="card glass"><h2>⚙️ Settings</h2>' +
      '<p class="sub">' + (VIEW ? "You’re viewing a read-only snapshot." : "Appearance, scoring and data for this device.") + "</p>" +
      '<p class="section-title">Appearance</p>' +
      '<div class="seg">' + seg("light", "☀️ Light") + seg("dark", "🌙 Dark") + seg("system", "📱 System") + "</div>" +
      '<p class="hint">System follows your device’s light/dark preference automatically.</p>' +
      "</div>";

    if (VIEW) {
      settingsEl.innerHTML = appearance +
        '<div class="card glass"><p class="section-title">Snapshot</p>' +
        '<button class="btn primary block" id="exitSnapSettings">Open my own scorer</button>' +
        '<p class="hint">Leaves this shared snapshot; your device keeps its own scores.</p></div>';
      return;
    }

    settingsEl.innerHTML = appearance +
      '<div class="card glass"><p class="section-title">Scoring</p>' +
      switchRow("wake", "Keep screen awake", "While scoring point by point, the screen won’t sleep.") +
      switchRow("autosave", "Auto-save finished games", "A game reaching its target drops straight into the score rows.") +
      switchRow("speech", "Announce scores", "Speaks the score after every rally, plus game and golden points.") +
      switchRow("sound", "Sound effects", "A tick per point (a different note per house) and a game-over fanfare.") +
      "</div>" +
      '<div class="card glass"><p class="section-title">Backup &amp; restore</p>' +
      '<p class="hint" style="margin:0 0 12px;">Scores live in this browser only. Download a backup to keep them safe, or move the cup to another phone by importing the file’s contents there.</p>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
      '<button class="btn grow" id="exportFile">⬇️ Download backup</button>' +
      '<button class="btn ghost" id="exportCopy">Copy</button></div>' +
      '<hr class="divider" />' +
      '<div class="field"><label>Restore from a backup — paste it here</label>' +
      '<input type="text" id="importBox" placeholder=\'{"app":"verandas-cup", …}\' /></div>' +
      '<button class="btn block" id="importBtn">Import backup</button>' +
      "</div>" +
      '<div class="card glass"><p class="section-title">Danger zone</p>' +
      '<button class="btn danger block" id="resetAll">Reset all results</button>' +
      '<p class="hint">Clears every recorded result. The Roll of Contests and rosters stay.</p>' +
      "</div>" +
      '<div class="card glass"><p class="decree">🏆 The Verandas Pickleball Cup · scorekeeper<br/>' +
      "Two houses. One cup. Endless glory.</p></div>";
  }

  settingsEl.addEventListener("click", (e) => {
    const th = e.target.closest("[data-theme-pref]");
    if (th) { setThemePref(th.dataset.themePref); buzz(8); renderSettings(); return; }

    const swRow = e.target.closest("[data-pref]");
    if (swRow) {
      const key = swRow.dataset.pref;
      prefs[key] = !prefs[key];
      savePrefs();
      buzz(8);
      if (key === "sound" && prefs.sound) pointSound(0);
      if (key === "speech" && prefs.speech) announce("Score announcements on.");
      if (key === "wake" && !prefs.wake) releaseWake();
      renderSettings();
      return;
    }
    if (e.target.closest("#exitSnapSettings")) {
      location.hash = "";
      location.reload();
      return;
    }

    if (e.target.closest("#exportFile")) {
      const blob = new Blob([backupJson()], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "verandas-cup-backup.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      return;
    }
    if (e.target.closest("#exportCopy")) {
      const txt = backupJson();
      const done = () => alert("Backup copied — paste it somewhere safe.");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done, () => prompt("Copy the backup below:", txt));
      } else {
        prompt("Copy the backup below:", txt);
      }
      return;
    }
    if (e.target.closest("#importBtn")) {
      const raw = (document.getElementById("importBox").value || "").trim();
      if (!raw) { alert("Paste a backup first."); return; }
      try {
        const parsed = JSON.parse(raw);
        const data = parsed && parsed.app === "verandas-cup" ? parsed.data : parsed;
        if (!data || !Array.isArray(data.contests)) throw new Error("bad shape");
        if (!confirm("Replace everything on this device with the imported backup?")) return;
        store = data;
        ui.contestId = null; ui.edit = null; ui.playerOpen = null;
        save();
        renderAll();
        alert("Backup imported — the cup is restored. 🏆");
      } catch (err) {
        alert("That doesn’t look like a Verandas Cup backup — check the pasted text.");
      }
      return;
    }
    if (e.target.closest("#resetAll")) {
      if (confirm("Clear every recorded result (contests stay)?") &&
          confirm("Really reset the whole cup? This cannot be undone.")) {
        store = defaultStore();
        ui.contestId = null; ui.edit = null; ui.playerOpen = null;
        save();
        renderAll();
      }
    }
  });

  /* ============================================================
     NAV + BOOT
     ============================================================ */
  function renderAll() {
    renderOverview();
    renderContests();
    renderHouses();
    renderSettings();
  }

  document.querySelectorAll(".bnav").forEach((btn) => {
    btn.addEventListener("click", () => {
      ui.tab = btn.dataset.tab;
      buzz(8);
      document.querySelectorAll(".bnav").forEach((b) => b.classList.toggle("is-active", b === btn));
      document.querySelectorAll(".tab-panel").forEach((p) =>
        p.classList.toggle("is-active", p.id === "tab-" + ui.tab));
      if (ui.tab === "overview") renderOverview();
      else if (ui.tab === "contests") renderContests();
      else if (ui.tab === "houses") renderHouses();
      else renderSettings();
    });
  });

  renderAll();

  // install-to-homescreen + offline (only when served over http/https)
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
  </script>
</body>
</html>
