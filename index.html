<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1026" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>The Verandas Pickleball Cup</title>
  <style>
/* ============================================================
   The Verandas Pickleball Cup — Liquid Glass
   Two houses. One cup. Endless glory.
   ============================================================ */
:root {
  --glass-bg: rgba(255, 255, 255, 0.10);
  --glass-bg-strong: rgba(255, 255, 255, 0.16);
  --glass-border: rgba(255, 255, 255, 0.28);
  --glass-highlight: rgba(255, 255, 255, 0.55);
  --text: #f4f7ff;
  --text-dim: rgba(233, 238, 255, 0.66);
  --text-faint: rgba(233, 238, 255, 0.42);
  --accent: #7bdcff;
  --accent-2: #b98cff;
  --good: #5ff0b0;
  --gold: #ffd479;
  --bad: #ff7a97;
  --smashers: #c59dff;       /* House of the Mighty Smash */
  --smashers-deep: #7a4fd0;
  --dinkers: #7bdcff;        /* Order of the Noble Dink */
  --dinkers-deep: #2f7fd0;
  --radius: 26px;
  --radius-sm: 16px;
  --shadow: 0 18px 50px rgba(4, 8, 30, 0.45);
  --blur: blur(22px) saturate(180%);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
    Arial, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  color: var(--text);
  background: #0b1026;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ---------- animated backdrop ---------- */
.bg {
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(1200px 800px at 80% -10%, #1b2a6b 0%, transparent 60%),
    radial-gradient(1000px 900px at -10% 110%, #3a1a5e 0%, transparent 55%),
    linear-gradient(160deg, #0b1026 0%, #0e1330 45%, #120a2a 100%);
}
.blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: 0.55; z-index: -1; will-change: transform; }
.b1 { width: 46vmax; height: 46vmax; left: -8vmax; top: -10vmax;
  background: radial-gradient(circle at 30% 30%, #7a4fd0, transparent 70%);
  animation: drift1 22s ease-in-out infinite; }
.b2 { width: 40vmax; height: 40vmax; right: -10vmax; top: 8vmax;
  background: radial-gradient(circle at 50% 50%, #2f7fd0, transparent 70%);
  animation: drift2 26s ease-in-out infinite; }
.b3 { width: 38vmax; height: 38vmax; left: 20vmax; bottom: -16vmax;
  background: radial-gradient(circle at 50% 50%, #2fe0d0, transparent 70%);
  animation: drift3 30s ease-in-out infinite; }
.b4 { width: 30vmax; height: 30vmax; right: 10vmax; bottom: -8vmax;
  background: radial-gradient(circle at 50% 50%, #ffb35c, transparent 70%);
  animation: drift1 34s ease-in-out infinite reverse; }
@keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(6vmax, 4vmax) scale(1.1); } }
@keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-5vmax, 6vmax) scale(1.08); } }
@keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(4vmax, -5vmax) scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .blob { animation: none; } }

/* ---------- glass surface ---------- */
.glass {
  background: var(--glass-bg);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow),
    inset 0 1px 0 var(--glass-highlight),
    inset 0 -1px 1px rgba(0, 0, 0, 0.18);
}

/* ---------- app chrome ---------- */
.app-header {
  position: sticky; top: 10px; z-index: 20;
  margin: 12px auto 0; max-width: 640px;
  padding: 10px 16px;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  width: calc(100% - 24px);
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px; flex: none;
  display: grid; place-items: center; font-size: 20px;
  background: linear-gradient(150deg, rgba(255,255,255,.25), rgba(255,255,255,.05));
  border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
}
.brand-text { min-width: 0; }
.brand-text h1 { margin: 0; font-size: 16px; letter-spacing: .2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-text p { margin: 1px 0 0; font-size: 11px; color: var(--text-dim); }

.app-main {
  max-width: 640px; margin: 16px auto 0;
  width: calc(100% - 24px);
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}
.tab-panel { display: none; }
.tab-panel.is-active { display: block; animation: fade .3s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- bottom tab bar ---------- */
.bottom-nav {
  position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 40;
  width: min(400px, calc(100% - 24px));
  display: flex; justify-content: space-around; align-items: stretch;
  padding: 8px 8px;
  border-radius: 26px;
  background: rgba(14, 18, 44, 0.55);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow), inset 0 1px 0 var(--glass-highlight);
}
.bnav {
  appearance: none; border: 0; background: transparent; cursor: pointer;
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 7px 4px 6px; border-radius: 18px; color: var(--text-faint);
  font-family: inherit; font-size: 10.5px; font-weight: 700; letter-spacing: .4px;
  transition: all .2s ease;
}
.bnav .ico { font-size: 21px; line-height: 1; filter: grayscale(.6) opacity(.75); transition: all .2s ease; }
.bnav.is-active {
  color: #0b1026;
  background: linear-gradient(150deg, #eaf3ff, #cfe0ff);
  box-shadow: 0 6px 18px rgba(120,170,255,.4);
}
.bnav.is-active .ico { filter: none; }
.bnav:not(.is-active):hover { color: var(--text-dim); }

/* ---------- cards & generic ---------- */
.card { padding: 20px; margin-bottom: 16px; }
.card h2 { margin: 0 0 4px; font-size: 18px; }
.card .sub { margin: 0 0 16px; color: var(--text-dim); font-size: 13px; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--text-faint); margin: 0 0 10px; }

.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-dim);
  margin-bottom: 6px; letter-spacing: .3px; }

input[type="text"], input[type="number"], select {
  width: 100%; color: var(--text); font-size: 15px; font-family: inherit;
  padding: 11px 13px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.2);
  transition: border .2s, background .2s;
}
input::placeholder { color: var(--text-faint); }
input:focus, select:focus { outline: none; border-color: var(--accent);
  background: rgba(255,255,255,.13); }
select option { color: #10142c; }

/* ---------- buttons ---------- */
.btn {
  appearance: none; cursor: pointer; font-family: inherit; font-weight: 600;
  font-size: 15px; color: var(--text); padding: 12px 18px; border-radius: 14px;
  background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  transition: transform .12s ease, background .2s ease;
}
.btn:hover { background: rgba(255,255,255,.22); }
.btn:active { transform: scale(.97); }
.btn.primary {
  color: #0b1026; border-color: transparent;
  background: linear-gradient(150deg, #9be8ff, #a99bff);
  box-shadow: 0 10px 24px rgba(130,150,255,.35), inset 0 1px 0 rgba(255,255,255,.6);
}
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: rgba(255,255,255,.06); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 8px 12px; font-size: 13px; border-radius: 11px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ---------- head-to-head hero ---------- */
.h2h { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;
  padding: 6px 0 2px; }
.h2h .house { text-align: center; min-width: 0; }
.h2h .house .crest { font-size: 30px; }
.h2h .house .hname { font-weight: 800; font-size: 14.5px; margin-top: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h2h .house .score { font-size: 42px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.h2h .house .cats { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
.h2h .house.sm .hname, .h2h .house.sm .score { color: var(--smashers); }
.h2h .house.dk .hname, .h2h .house.dk .score { color: var(--dinkers); }
.h2h .vs { font-size: 18px; color: var(--text-faint); font-weight: 800; padding: 0 2px; }

.progress { height: 10px; border-radius: 6px; overflow: hidden; display: flex;
  background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.12); margin: 14px 0 6px; }
.progress .p-sm { background: linear-gradient(90deg, var(--smashers-deep), var(--smashers)); }
.progress .p-dk { background: linear-gradient(270deg, var(--dinkers-deep), var(--dinkers)); }
.progress-note { text-align: center; font-size: 12px; color: var(--text-dim); }

.lead-banner { text-align: center; padding: 12px 10px 4px; }
.lead-banner .cup { font-size: 36px; }
.lead-banner .who { font-size: 20px; font-weight: 800; margin-top: 4px; }
.lead-banner .who.sm { color: var(--smashers); }
.lead-banner .who.dk { color: var(--dinkers); }
.lead-banner .who.tie { color: var(--gold); }
.lead-banner .txt { color: var(--text-dim); font-size: 12.5px; margin-top: 3px; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; gap: 9px; }
.row-item {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 15px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
}
.row-item .main { min-width: 0; flex: 1; }
.row-item .ttl { font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; }
.row-item .meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
.row-item.clickable { cursor: pointer; transition: background .18s; }
.row-item.clickable:hover { background: rgba(255,255,255,.12); }
.row-item.won-sm { border-left: 3px solid var(--smashers); }
.row-item.won-dk { border-left: 3px solid var(--dinkers); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
  padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.16); white-space: nowrap; }
.pill.sm { color: var(--smashers); border-color: rgba(197,157,255,.45); }
.pill.dk { color: var(--dinkers); border-color: rgba(123,220,255,.45); }
.pill.gold { color: var(--gold); border-color: rgba(255,212,121,.4); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }

.inline-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.inline-form .field { margin: 0; flex: 1 1 130px; }
.grow { flex: 1 1 auto; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .two-col { grid-template-columns: 1fr; } }

/* ---------- contest detail ---------- */
.side-block { padding: 13px; border-radius: var(--radius-sm);
  background: rgba(0,0,0,.14); border: 1px solid rgba(255,255,255,.1); }
.side-block .side-name { font-weight: 800; font-size: 13px; margin-bottom: 9px; }
.side-block.sm { border-color: rgba(197,157,255,.35); }
.side-block.sm .side-name { color: var(--smashers); }
.side-block.dk { border-color: rgba(123,220,255,.35); }
.side-block.dk .side-name { color: var(--dinkers); }
.side-block .field { margin-bottom: 8px; }
.side-block .field:last-child { margin-bottom: 0; }

.game-row { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
.game-row .glbl { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .6px; width: 52px; }
.game-row .dash { color: var(--text-faint); font-weight: 800; }
.game-row input { text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

.result-line { text-align: center; padding: 10px 0 2px; }
.result-line .players { font-size: 14px; font-weight: 700; }
.result-line .players .side-a { color: var(--smashers); }
.result-line .players .side-b { color: var(--dinkers); }
.result-line .scoreline { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 4px; }
.result-line .note { font-size: 12px; color: var(--text-dim); margin-top: 3px; }

/* ---------- houses tab ---------- */
.house-card { position: relative; overflow: hidden; }
.house-card.sm { border-color: rgba(197,157,255,.4); }
.house-card.dk { border-color: rgba(123,220,255,.4); }
.house-card .hc-top { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.house-card .hc-crest { font-size: 34px; }
.house-card .hc-name { font-size: 19px; font-weight: 800; margin: 0; }
.house-card.sm .hc-name { color: var(--smashers); }
.house-card.dk .hc-name { color: var(--dinkers); }
.house-card .hc-title { font-size: 12px; color: var(--text-dim); margin: 1px 0 0; }
.house-card .hc-motto { font-size: 12.5px; font-style: italic; color: var(--text-faint); margin: 8px 0 14px; }
.roster { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
.roster .player { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600;
  padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,.05); }
.roster .num { width: 20px; height: 20px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-size: 10px; font-weight: 800;
  background: rgba(255,255,255,.1); color: var(--text-dim); }

/* ---------- misc ---------- */
.empty { text-align: center; color: var(--text-dim); padding: 24px 14px; font-size: 14px; }
.empty .big { font-size: 32px; display: block; margin-bottom: 10px; opacity: .8; }
.divider { height: 1px; background: rgba(255,255,255,.12); margin: 16px 0; border: 0; }
.spacer { height: 8px; }
.hint { font-size: 12px; color: var(--text-faint); margin-top: 8px; line-height: 1.5; }
.back-link { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  color: var(--text-dim); font-size: 14px; margin-bottom: 12px; background: none; border: 0; font-family: inherit; padding: 4px 0; }
.back-link:hover { color: var(--text); }
.decree { font-size: 12px; color: var(--text-faint); text-align: center; line-height: 1.6; }
  </style>
</head>
<body>
  <!-- animated liquid-glass backdrop -->
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span>
    <span class="blob b3"></span><span class="blob b4"></span>
  </div>

  <header class="app-header glass">
    <div class="brand">
      <div class="brand-mark">🏆</div>
      <div class="brand-text">
        <h1>The Verandas Pickleball Cup</h1>
        <p>Two houses · One cup · Endless glory</p>
      </div>
    </div>
  </header>

  <main class="app-main">
    <section id="tab-overview" class="tab-panel is-active"></section>
    <section id="tab-contests" class="tab-panel"></section>
    <section id="tab-houses" class="tab-panel"></section>
  </main>

  <nav class="bottom-nav" role="tablist">
    <button class="bnav is-active" data-tab="overview" role="tab"><span class="ico">🏆</span>Overview</button>
    <button class="bnav" data-tab="contests" role="tab"><span class="ico">⚔️</span>Contests</button>
    <button class="bnav" data-tab="houses" role="tab"><span class="ico">🛡️</span>Houses</button>
  </nav>

  <script>
/* ============================================================
   The Verandas Pickleball Cup — scorekeeper
   Soni Smashers vs Sam Dinkers across the Roll of Contests.
   Each contest won awards its points (10 by decree); most
   points claims the throne. Vanilla JS + localStorage.
   ============================================================ */
(function () {
  "use strict";

  /* ---------------- the two houses ---------------- */
  const HOUSES = [
    {
      key: "sm", name: "Soni Smashers", crest: "🟣",
      title: "House of the Mighty Smash",
      motto: "“We came to smash, not to curtsy.”",
      roster: ["Chandni", "Avni", "Satish", "Suryansh", "Kevin", "Vyom", "Tarun",
               "Dhruv", "Rahul", "Harsh", "Aloke", "Manish", "Gautam", "Amrish"],
    },
    {
      key: "dk", name: "Sam Dinkers", crest: "🔵",
      title: "Order of the Noble Dink",
      motto: "“A gentle dink, a ruthless mind.”",
      roster: ["Jannat", "Amy", "Shivam", "Amitabh", "Rashmi", "Ryan", "Pranav",
               "Garv", "Nitin", "Kunal", "Prashant", "Sanjay", "Pahuja", "Manoj"],
    },
  ];

  /* ---------------- Exhibit A + B — the Roll of Contests ---------------- */
  // kind: "singles" (1 player/house) | "doubles" (2) | "special" (whole team)
  const DEFAULT_CONTESTS = [
    { name: "Risers Doubles", kind: "doubles", icon: "⬆️",
      desc: "For the improved newcomers of the community — rising swiftly through the ranks." },
    { name: "Risers Singles", kind: "singles", icon: "⬆️",
      desc: "For the improved newcomers — each rising warrior fights alone." },
    { name: "Women’s Doubles", kind: "doubles", icon: "👑",
      desc: "A noble pairing of lady contenders, battling side by side for glory." },
    { name: "Mixed Doubles", kind: "doubles", icon: "🤝",
      desc: "A balanced alliance of lady and gent, forged for strategy, mischief, and victory." },
    { name: "50+ Doubles", kind: "doubles", icon: "🎖️",
      desc: "For seasoned champions of 50 years and above — wisdom paired with precision." },
    { name: "50+ Singles", kind: "singles", icon: "🎖️",
      desc: "For seasoned champions of 50 and above — one paddle, one player, one destiny." },
    { name: "Men’s Doubles", kind: "doubles", icon: "🦁",
      desc: "For the pro gentlemen of the realm — a fierce two-man campaign for honor." },
    { name: "Men’s Singles", kind: "singles", icon: "🗡️",
      desc: "For the pro gentlemen of the realm — every warrior stands alone." },
    { name: "Combined Age 80+ Doubles", kind: "doubles", icon: "🛡️",
      desc: "Open to pairs whose combined age is 80 or greater — experience is a deadly weapon." },
    { name: "Split Age 50+/− Doubles", kind: "doubles", icon: "⚖️",
      desc: "One player above 50, one below — a cross-generational alliance of guile and energy." },
    { name: "Gender Neutral Open Doubles", kind: "doubles", icon: "😈",
      desc: "Open to all pairings of the realm — if thou canst paddle, thou canst battle." },
    { name: "Grand Team Rally", kind: "special", icon: "🃏", points: 0,
      desc: "Exhibit B — further details shall be revealed in due course… suspense is part of the sport. Set its points when the council decrees them." },
  ];

  /* ---------------- storage ---------------- */
  const KEY = "verandas_cup_v1";

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  const esc = (s) =>
    String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const buzz = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

  function seedContests() {
    return DEFAULT_CONTESTS.map((c) => ({
      id: uid() + Math.random().toString(36).slice(2, 5),
      name: c.name, kind: c.kind, icon: c.icon, desc: c.desc,
      points: c.points != null ? c.points : 10,
      playersA: [], playersB: [],   // fielded players per house
      games: [],                     // [{a,b}] game scores
      winner: null,                  // 0 = Smashers, 1 = Dinkers
      done: false,
    }));
  }
  const defaultStore = () => ({ contests: seedContests(), created: Date.now() });

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (Array.isArray(s.contests)) return s;
      }
    } catch (e) {}
    const s = defaultStore();
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
    return s;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }

  let store = load();
  const ui = { tab: "overview", contestId: null, edit: null };

  const findContest = (id) => store.contests.find((c) => c.id === id);

  /* ---------------- cup math ---------------- */
  function gamesWon(c) {
    let a = 0, b = 0;
    c.games.forEach((g) => { if (g.a > g.b) a++; else if (g.b > g.a) b++; });
    return [a, b];
  }

  function cupTotals() {
    const pts = [0, 0], cats = [0, 0];
    let decided = 0;
    store.contests.forEach((c) => {
      if (!c.done || c.winner == null) return;
      decided++;
      cats[c.winner]++;
      pts[c.winner] += c.points || 0;
    });
    return { pts, cats, decided, total: store.contests.length };
  }

  function playersLabel(c, side) {
    const arr = side === 0 ? c.playersA : c.playersB;
    const names = (arr || []).filter(Boolean);
    return names.length ? names.join(" & ") : HOUSES[side].name;
  }

  /* ============================================================
     OVERVIEW TAB
     ============================================================ */
  const overviewEl = document.getElementById("tab-overview");

  function renderOverview() {
    const { pts, cats, decided, total } = cupTotals();
    const allDone = decided === total;
    const leader = pts[0] > pts[1] ? 0 : pts[1] > pts[0] ? 1 : null;

    let banner = "";
    if (decided > 0) {
      if (allDone) {
        banner = leader == null
          ? '<div class="lead-banner"><div class="cup">🤝</div><div class="who tie">The houses share the glory</div>' +
            '<div class="txt">level on ' + pts[0] + ' points after all ' + total + " contests</div></div>"
          : '<div class="lead-banner"><div class="cup">👑</div><div class="who ' + HOUSES[leader].key + '">' +
            esc(HOUSES[leader].name) + '</div><div class="txt">claim the throne · ' +
            pts[leader] + " points to " + pts[leader ^ 1] + "</div></div>";
      } else if (leader != null) {
        banner = '<div class="lead-banner"><div class="cup">⚔️</div><div class="who ' + HOUSES[leader].key + '">' +
          esc(HOUSES[leader].name) + ' lead</div><div class="txt">' +
          pts[leader] + " – " + pts[leader ^ 1] + " with " + (total - decided) + " contests to fight</div></div>";
      } else {
        banner = '<div class="lead-banner"><div class="cup">⚔️</div><div class="who tie">All square</div>' +
          '<div class="txt">' + pts[0] + " – " + pts[1] + " with " + (total - decided) + " contests to fight</div></div>";
      }
    }

    const pctSm = decided ? Math.round((cats[0] / total) * 100) : 0;
    const pctDk = decided ? Math.round((cats[1] / total) * 100) : 0;

    const houseCol = (i) =>
      '<div class="house ' + HOUSES[i].key + '"><div class="crest">' + HOUSES[i].crest + "</div>" +
      '<div class="hname">' + esc(HOUSES[i].name) + "</div>" +
      '<div class="score">' + pts[i] + "</div>" +
      '<div class="cats">' + cats[i] + (cats[i] === 1 ? " contest" : " contests") + " won</div></div>";

    const decidedRows = store.contests.filter((c) => c.done && c.winner != null);
    const recent = decidedRows.length
      ? decidedRows.map((c) => {
          const w = c.winner;
          const scoreline = c.games.length ? c.games.map((g) => g.a + "–" + g.b).join(", ") : "";
          return '<div class="row-item won-' + HOUSES[w].key + '">' +
            '<div class="main"><div class="ttl">' + c.icon + " " + esc(c.name) + "</div>" +
            '<div class="meta">' + esc(playersLabel(c, w)) + " won" + (scoreline ? " · " + scoreline : "") + "</div></div>" +
            '<span class="pill ' + HOUSES[w].key + '">+' + (c.points || 0) + " pts</span></div>";
        }).join("")
      : '<div class="empty"><span class="big">⚔️</span>No contests decided yet.<br/>Record results in the Contests tab.</div>';

    overviewEl.innerHTML =
      '<div class="card glass">' +
      '<div class="h2h">' + houseCol(0) + '<div class="vs">VS</div>' + houseCol(1) + "</div>" +
      banner +
      '<div class="progress">' +
      '<div class="p-sm" style="width:' + pctSm + '%"></div>' +
      '<div style="flex:1"></div>' +
      '<div class="p-dk" style="width:' + pctDk + '%"></div>' +
      "</div>" +
      '<div class="progress-note">' + decided + " of " + total + " contests decided</div>" +
      "</div>" +
      '<div class="card glass"><p class="section-title">Contests decided</p><div class="spacer"></div>' +
      '<div class="list">' + recent + "</div></div>" +
      '<div class="card glass"><p class="decree">⚖️ By decree: rally point scoring, golden point settles tied games.<br/>' +
      "Races to 15 or 21 as proclaimed per contest. Each contest won awards its points.<br/>" +
      "Rules may change. Because the council said so. 😎</p>" +
      '<hr class="divider" /><button class="btn danger block" id="resetAll">Reset all results</button></div>';
  }

  overviewEl.addEventListener("click", (e) => {
    if (e.target.closest("#resetAll")) {
      if (confirm("Clear every recorded result (contests stay)?") &&
          confirm("Really reset the whole cup? This cannot be undone.")) {
        store = defaultStore();
        ui.contestId = null; ui.edit = null;
        save();
        renderAll();
      }
    }
  });

  /* ============================================================
     CONTESTS TAB — roll of contests → contest detail
     ============================================================ */
  const conEl = document.getElementById("tab-contests");

  function renderContests() {
    const c = ui.contestId && findContest(ui.contestId);
    if (c) return renderContestDetail(c);
    ui.contestId = null; ui.edit = null;
    renderContestList();
  }

  function renderContestList() {
    const rows = store.contests.map((c) => {
      const status = c.done && c.winner != null
        ? '<span class="pill ' + HOUSES[c.winner].key + '">🏅 ' + esc(HOUSES[c.winner].name.split(" ")[1]) + "</span>"
        : '<span class="pill">' + (c.points ? c.points + " pts" : "pts TBD") + "</span>";
      return '<div class="row-item clickable' + (c.done && c.winner != null ? " won-" + HOUSES[c.winner].key : "") +
        '" data-open="' + c.id + '">' +
        '<div class="main"><div class="ttl">' + c.icon + " " + esc(c.name) + "</div>" +
        '<div class="meta">' + (c.kind === "special" ? "Exhibit B · whole team" :
          c.kind === "singles" ? "Singles · 1 per house" : "Doubles · 2 per house") +
        (c.done ? " · decided" : "") + "</div></div>" + status + "</div>";
    }).join("");

    conEl.innerHTML =
      '<div class="card glass"><h2>⚔️ The Roll of Contests</h2>' +
      '<p class="sub">Exhibit A — the championship divisions, plus the Grand Team Rally. Tap a contest to record its result.</p>' +
      '<div class="list">' + rows + "</div>" +
      '<hr class="divider" />' +
      '<div class="inline-form"><div class="field grow"><label>Add a contest (the council may decree more)</label>' +
      '<input type="text" id="newContestName" placeholder="Contest name" maxlength="50" /></div>' +
      '<button class="btn" id="addContest">Add</button></div></div>';
  }

  function editState(c) {
    if (ui.edit && ui.edit.id === c.id) return ui.edit;
    ui.edit = {
      id: c.id,
      playersA: [c.playersA[0] || "", c.playersA[1] || ""],
      playersB: [c.playersB[0] || "", c.playersB[1] || ""],
      games: c.games.length ? c.games.map((g) => ({ a: String(g.a), b: String(g.b) })) : [{ a: "", b: "" }],
      points: String(c.points != null ? c.points : 10),
      specialWinner: c.winner,
    };
    return ui.edit;
  }

  function playerSelect(side, slot, val) {
    const h = HOUSES[side];
    const opts = ['<option value="">— player ' + (slot + 1) + " —</option>"].concat(
      h.roster.map((p) => '<option value="' + esc(p) + '"' + (p === val ? " selected" : "") + ">" + esc(p) + "</option>"));
    return '<select data-player="' + side + "-" + slot + '">' + opts.join("") + "</select>";
  }

  function renderContestDetail(c) {
    const slots = c.kind === "singles" ? 1 : 2;

    if (c.done && c.winner != null) {
      // decided view
      const w = c.winner;
      const scoreline = c.games.length ? c.games.map((g) => g.a + " – " + g.b).join(" · ") : "";
      conEl.innerHTML =
        '<button class="back-link" id="backToRoll">← Roll of Contests</button>' +
        '<div class="card glass">' +
        "<h2>" + c.icon + " " + esc(c.name) + "</h2>" +
        '<p class="sub">' + esc(c.desc) + "</p>" +
        '<div class="result-line">' +
        '<div class="players"><span class="side-a">' + esc(playersLabel(c, 0)) + "</span>" +
        ' <span style="color:var(--text-faint)">vs</span> ' +
        '<span class="side-b">' + esc(playersLabel(c, 1)) + "</span></div>" +
        (scoreline ? '<div class="scoreline">' + scoreline + "</div>" : "") +
        '<div class="note">🏅 ' + esc(HOUSES[w].name) + " take the contest · +" + (c.points || 0) + " points</div>" +
        "</div>" +
        '<div class="spacer"></div><div class="spacer"></div>' +
        '<div style="display:flex;gap:10px;">' +
        '<button class="btn ghost grow" id="reopenContest">Reopen &amp; edit</button>' +
        '<button class="btn danger small" id="deleteContest">Delete contest</button></div>' +
        "</div>";
      return;
    }

    const ed = editState(c);
    const isSpecial = c.kind === "special";

    const sideBlock = (side) => {
      const h = HOUSES[side];
      let inner = "";
      for (let s = 0; s < slots; s++) {
        inner += '<div class="field">' + playerSelect(side, s, side === 0 ? ed.playersA[s] : ed.playersB[s]) + "</div>";
      }
      return '<div class="side-block ' + h.key + '"><div class="side-name">' + h.crest + " " + esc(h.name) + "</div>" + inner + "</div>";
    };

    const gameRows = ed.games.map((g, i) =>
      '<div class="game-row"><span class="glbl">Game ' + (i + 1) + "</span>" +
      '<input type="number" min="0" max="99" data-game="' + i + '-a" value="' + esc(g.a) + '" placeholder="0" />' +
      '<span class="dash">–</span>' +
      '<input type="number" min="0" max="99" data-game="' + i + '-b" value="' + esc(g.b) + '" placeholder="0" /></div>').join("");

    const specialPick = isSpecial
      ? '<p class="section-title">Winner</p>' +
        '<div class="two-col">' +
        '<button class="btn ' + (ed.specialWinner === 0 ? "primary" : "ghost") + '" data-special-win="0">' + HOUSES[0].crest + " " + esc(HOUSES[0].name) + "</button>" +
        '<button class="btn ' + (ed.specialWinner === 1 ? "primary" : "ghost") + '" data-special-win="1">' + HOUSES[1].crest + " " + esc(HOUSES[1].name) + "</button>" +
        '</div><div class="spacer"></div>'
      : "";

    conEl.innerHTML =
      '<button class="back-link" id="backToRoll">← Roll of Contests</button>' +
      '<div class="card glass">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">' +
      "<div><h2>" + c.icon + " " + esc(c.name) + "</h2>" +
      '<p class="sub">' + esc(c.desc) + "</p></div>" +
      '<button class="btn danger small" id="deleteContest">Delete</button></div>' +
      (isSpecial ? "" :
        '<p class="section-title">Who takes the court</p>' +
        '<div class="two-col">' + sideBlock(0) + sideBlock(1) + "</div>" +
        '<hr class="divider" />' +
        '<p class="section-title">Game scores <span style="text-transform:none;letter-spacing:0;">(' +
        esc(HOUSES[0].name) + " – " + esc(HOUSES[1].name) + ")</span></p>" +
        gameRows +
        (ed.games.length < 3 ? '<button class="btn ghost small" id="addGame">+ Add game</button>' : "") +
        '<p class="hint">Rally point scoring · race to 15 or 21 · golden point settles a tied game.</p>' +
        '<hr class="divider" />') +
      specialPick +
      '<div class="inline-form">' +
      '<div class="field" style="flex:0 0 130px;"><label>Points at stake</label>' +
      '<input type="number" id="contestPoints" min="0" max="99" value="' + esc(ed.points) + '" /></div>' +
      '<button class="btn primary grow" id="recordResult">Record result 🏅</button>' +
      "</div>" +
      (isSpecial ? '<p class="hint">Exhibit B — set the points once the council reveals them, pick the winner, record.</p>' : "") +
      "</div>";
  }

  /* ---- contest actions ---- */
  function commitResult(c) {
    const ed = editState(c);
    const points = Math.max(0, Math.min(99, parseInt(ed.points, 10) || 0));

    if (c.kind === "special") {
      if (ed.specialWinner == null) { alert("Pick the winning house first."); return; }
      c.winner = ed.specialWinner;
      c.games = [];
      c.playersA = []; c.playersB = [];
    } else {
      const games = [];
      for (const g of ed.games) {
        const a = parseInt(g.a, 10), b = parseInt(g.b, 10);
        if (isNaN(a) && isNaN(b)) continue;           // untouched row
        if (isNaN(a) || isNaN(b)) { alert("Fill in both sides of every game score."); return; }
        if (a === b) { alert("A game can't end tied — golden point decides it!"); return; }
        games.push({ a, b });
      }
      if (!games.length) { alert("Enter at least one game score."); return; }
      let wa = 0, wb = 0;
      games.forEach((g) => { if (g.a > g.b) wa++; else wb++; });
      if (wa === wb) { alert("Games are level — add a deciding game."); return; }
      c.games = games;
      c.winner = wa > wb ? 0 : 1;
      c.playersA = ed.playersA.filter(Boolean);
      c.playersB = ed.playersB.filter(Boolean);
    }

    c.points = points;
    c.done = true;
    ui.edit = null;
    buzz(20);
    save();
    renderAll();
  }

  conEl.addEventListener("click", (e) => {
    const openBtn = e.target.closest("[data-open]");
    if (openBtn) { ui.contestId = openBtn.dataset.open; ui.edit = null; renderContests(); return; }
    if (e.target.closest("#backToRoll")) { ui.contestId = null; ui.edit = null; renderContests(); return; }

    if (e.target.closest("#addContest")) {
      const name = (document.getElementById("newContestName").value || "").trim();
      if (!name) { alert("Name the new contest first."); return; }
      store.contests.push({
        id: uid(), name, kind: "doubles", icon: "🆕",
        desc: "Decreed by the council mid-tournament. Rules may change. 😎",
        points: 10, playersA: [], playersB: [], games: [], winner: null, done: false,
      });
      save();
      renderContests();
      return;
    }

    const c = ui.contestId && findContest(ui.contestId);
    if (!c) return;

    if (e.target.closest("#recordResult")) return commitResult(c);
    if (e.target.closest("#reopenContest")) { c.done = false; ui.edit = null; save(); renderAll(); return; }
    if (e.target.closest("#deleteContest")) {
      if (confirm('Remove "' + c.name + '" from the roll?')) {
        store.contests = store.contests.filter((x) => x.id !== c.id);
        ui.contestId = null; ui.edit = null;
        save(); renderAll();
      }
      return;
    }
    if (e.target.closest("#addGame")) {
      const ed = editState(c);
      if (ed.games.length < 3) ed.games.push({ a: "", b: "" });
      renderContestDetail(c);
      return;
    }
    const sw = e.target.closest("[data-special-win]");
    if (sw) {
      const ed = editState(c);
      ed.specialWinner = parseInt(sw.dataset.specialWin, 10);
      renderContestDetail(c);
      return;
    }
  });

  // keep typed values in the transient edit state across re-renders
  conEl.addEventListener("input", (e) => {
    const c = ui.contestId && findContest(ui.contestId);
    if (!c) return;
    const ed = editState(c);
    if (e.target.dataset.game) {
      const [i, side] = e.target.dataset.game.split("-");
      ed.games[+i][side] = e.target.value;
    } else if (e.target.id === "contestPoints") {
      ed.points = e.target.value;
    }
  });
  conEl.addEventListener("change", (e) => {
    const c = ui.contestId && findContest(ui.contestId);
    if (!c) return;
    const ed = editState(c);
    if (e.target.dataset.player) {
      const [side, slot] = e.target.dataset.player.split("-").map(Number);
      (side === 0 ? ed.playersA : ed.playersB)[slot] = e.target.value;
    }
  });
  conEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.id === "newContestName") {
      e.preventDefault();
      document.getElementById("addContest").click();
    }
  });

  /* ============================================================
     HOUSES TAB — the roll call of the realm
     ============================================================ */
  const housesEl = document.getElementById("tab-houses");

  function renderHouses() {
    const houseCard = (i) => {
      const h = HOUSES[i];
      const players = h.roster.map((p, n) =>
        '<div class="player"><span class="num">' + (n + 1) + "</span>" + esc(p) + "</div>").join("");
      return '<div class="card glass house-card ' + h.key + '">' +
        '<div class="hc-top"><div class="hc-crest">' + h.crest + "</div>" +
        '<div><h2 class="hc-name">' + esc(h.name) + '</h2><p class="hc-title">' + esc(h.title) + "</p></div></div>" +
        '<p class="hc-motto">' + esc(h.motto) + "</p>" +
        '<div class="roster">' + players + "</div></div>";
    };

    housesEl.innerHTML =
      houseCard(0) + houseCard(1) +
      '<div class="card glass"><p class="decree">📜 Roll Call of the Realm · 14 warriors per house<br/>' +
      "Max 2 games per player, min 1 (Team Rally excluded). NO CHITCHING!<br/>" +
      "May the best house claim the throne. 🪑👑</p></div>";
  }

  /* ============================================================
     NAV + BOOT
     ============================================================ */
  function renderAll() {
    renderOverview();
    renderContests();
    renderHouses();
  }

  document.querySelectorAll(".bnav").forEach((btn) => {
    btn.addEventListener("click", () => {
      ui.tab = btn.dataset.tab;
      buzz(8);
      document.querySelectorAll(".bnav").forEach((b) => b.classList.toggle("is-active", b === btn));
      document.querySelectorAll(".tab-panel").forEach((p) =>
        p.classList.toggle("is-active", p.id === "tab-" + ui.tab));
      if (ui.tab === "overview") renderOverview();
      else if (ui.tab === "contests") renderContests();
      else renderHouses();
    });
  });

  renderAll();
})();
  </script>
</body>
</html>
